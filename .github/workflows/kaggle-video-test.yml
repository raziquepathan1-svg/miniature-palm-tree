name: Kaggle AI video - test

# Makes test makeover clips on a free Kaggle GPU with the open Wan 2.1 model, to compare with Google Flow.
# Needs the KAGGLE_USERNAME and KAGGLE_KEY secrets (kaggle.com -> Settings -> API -> Create New Token),
# and a phone-verified Kaggle account (needed for GPU and internet in Kaggle notebooks).
on:
  workflow_dispatch:
    inputs:
      prompt:
        description: "Prompt for the test clip (empty = abandoned rooftop clean-up)"
        required: false
        default: ""

permissions:
  contents: read

jobs:
  kaggle:
    runs-on: ubuntu-latest
    timeout-minutes: 150
    env:
      KAGGLE_USERNAME: ${{ secrets.KAGGLE_USERNAME }}
      KAGGLE_KEY: ${{ secrets.KAGGLE_KEY }}
    steps:
      - uses: actions/checkout@v4

      - name: Prepare the Kaggle job
        env:
          PROMPT: ${{ inputs.prompt }}
        run: |
          if [ -z "$KAGGLE_USERNAME" ] || [ -z "$KAGGLE_KEY" ]; then
            echo "::error::Add the KAGGLE_USERNAME and KAGGLE_KEY secrets to this repository first."; exit 1
          fi
          pip install -q kaggle
          mkdir -p job
          python - <<'EOF'
          import json, os
          prompt = os.environ.get("PROMPT") or (
              "Fixed high-angle camera, vertical time-lapse video, no camera movement. An abandoned dirty city "
              "rooftop with cracked concrete, trash bags, broken chairs and weeds. Three workers in neon yellow "
              "shirts quickly sweep, carry away trash and pressure-wash the floor. Realistic, natural daylight.")
          code = open("kaggle/gen_video.py").read().replace("PROMPTS_JSON", json.dumps([prompt]))
          open("job/gen_video.py", "w").write(code)
          user = os.environ["KAGGLE_USERNAME"].strip()
          json.dump({"id": f"{user}/rrs-video-gen", "title": "rrs-video-gen", "code_file": "gen_video.py",
                     "language": "python", "kernel_type": "script", "is_private": True, "enable_gpu": True,
                     "enable_internet": True, "dataset_sources": [], "competition_sources": [],
                     "kernel_sources": []}, open("job/kernel-metadata.json", "w"), indent=2)
          EOF

      - name: Run on Kaggle's GPU and wait
        run: |
          KERNEL="$(echo "$KAGGLE_USERNAME" | tr -d '[:space:]')/rrs-video-gen"
          kaggle kernels push -p job
          for i in $(seq 1 130); do
            sleep 60
            s=$(kaggle kernels status "$KERNEL" 2>&1 | tr '[:upper:]' '[:lower:]')
            echo "$(date -u +%H:%M) $s"
            case "$s" in
              *complete*) break ;;
              *error*|*cancel*) echo "::error::The Kaggle job failed: $s"; kaggle kernels output "$KERNEL" -p out || true; exit 1 ;;
            esac
          done
          mkdir -p out && kaggle kernels output "$KERNEL" -p out
          ls -la out
          tail -n 20 out/*.log 2>/dev/null || true

      - name: Save the clips for watching
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: kaggle-test-clips
          path: out/
          retention-days: 5
          if-no-files-found: warn
