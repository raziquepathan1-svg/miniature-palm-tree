name: Talking host - test

# Makes a short sample of the Health Support Studio host (your photo) saying a line in your cloned voice,
# on Kaggle's free GPU, and saves it as branding/health-support-studio/avatar/talk_test.mp4 to check.
on:
  workflow_dispatch:
    inputs:
      walk:
        description: "Instead: a 10-second lip-sync test on the walking clip"
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: host-talk-test
  cancel-in-progress: false

jobs:
  talk:
    runs-on: ubuntu-latest
    timeout-minutes: 150
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Cache voice models and fonts
        uses: actions/cache@v4
        with:
          path: |
            ~/.cache/kokoro
            ~/.cache/huggingface
          key: voice-models-clone-v1

      - name: Install
        run: |
          sudo apt-get update -q && sudo apt-get install -y -q ffmpeg fonts-dejavu-core
          pip install -q -r requirements.txt kaggle
          pip install -q torch==2.6.0 torchaudio==2.6.0 --index-url https://download.pytorch.org/whl/cpu
          pip install -q chatterbox-tts

      - name: Unlock the voice sample
        env:
          VOICE_KEY: ${{ secrets.VOICE_KEY }}
        run: |
          openssl enc -d -aes-256-cbc -pbkdf2 -iter 200000 -in voice/voice_sample.wav.enc \
            -out "$RUNNER_TEMP/voice_sample.wav" -pass env:VOICE_KEY
          echo "VOICE_SAMPLE=$RUNNER_TEMP/voice_sample.wav" >> "$GITHUB_ENV"

      - name: Narrate, make the host talk, and build the scene
        env:
          KAGGLE_USERNAME: ${{ secrets.KAGGLE_USERNAME }}
          KAGGLE_KEY: ${{ secrets.KAGGLE_KEY }}
          KAGGLE_API_TOKEN: ${{ secrets.KAGGLE_API_TOKEN }}
          PEXELS_API_KEY: ${{ secrets.PEXELS_API_KEY }}
          WALK: ${{ inputs.walk }}
        run: |
          [ -z "$KAGGLE_KEY" ] && unset KAGGLE_KEY
          [ -z "$KAGGLE_API_TOKEN" ] && unset KAGGLE_API_TOKEN
          python - <<'PY'
          import os, yaml
          from pathlib import Path
          from types import SimpleNamespace
          from youtube_agent import talking, visuals, voice
          from youtube_agent.planner import Scene
          cfg = yaml.safe_load(open("youtube_agent/config.yaml"))
          if os.environ.get("WALK") == "true":
              text = ("Most adults need at least seven hours of sleep every night. If you often feel tired, "
                      "start by going to bed at the same time every day.")
              work = Path("talk_work"); work.mkdir(exist_ok=True)
              wav = work / "walk.wav"
              duration, captions = voice.narrate_scene(text, cfg["voice"], wav)
              host = {"moves": "branding/health-support-studio/avatar/broll", "landscape_crop": 1.0,
                      "moves_only": ["Man_walking_in_hospital_corridor_20261007132552.mp4"]}
              clips = talking.make_clips({"walk": wav}, work, host)
              if not clips:
                  raise SystemExit("No lip-synced clip came back from Kaggle")
              visuals.ensure_fonts()
              ass = visuals.write_ass(captions, (1080, 1920), work / "walk.ass")
              dest = Path("branding/health-support-studio/avatar/talk_test.mp4")
              visuals.render_host_scene(clips["walk"], wav, ass, duration, (1080, 1920), dest)
              print(f"Saved {dest}")
              raise SystemExit(0)
          plan = yaml.safe_load(open("youtube_agent/script_bank/008-sleep-myths.yaml"))["plan"]
          scenes = [Scene(**s) for s in plan["scenes"][:5]]
          video = {**cfg["video"], "host": {**cfg["video"]["host"], "enabled": True, "every_seconds": 35, "first_at": 0}}
          out = visuals.build_video(SimpleNamespace(scenes=scenes), video, cfg["voice"], "Health Support Studio",
                                    Path("talk_work"))
          dest = Path("branding/health-support-studio/avatar/talk_test.mp4")
          dest.write_bytes(out.read_bytes())
          print(f"Saved {dest} ({dest.stat().st_size // 1024} KB)")
          PY
          rm -f "$VOICE_SAMPLE"

      - name: Save the sample
        run: |
          git config user.name "youtube-agent"
          git config user.email "youtube-agent@users.noreply.github.com"
          git add branding/health-support-studio/avatar/talk_test.mp4
          git commit -m "Talking host: test sample" && git pull --rebase && git push
