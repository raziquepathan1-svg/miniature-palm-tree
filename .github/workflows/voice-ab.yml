name: Voice A/B - pauses and emphasis

# Same words twice in the cloned voice: A = plain commas and periods (today's style),
# B = ellipses/dashes for pauses and emphasis + a little more expression. Saved to the previews branch.
on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  ab:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Cache voice models
        uses: actions/cache@v4
        with:
          path: |
            ~/.cache/kokoro
            ~/.cache/huggingface
          key: voice-models-clone-v1
      - name: Install
        run: |
          sudo apt-get update -q && sudo apt-get install -y -q ffmpeg
          pip install -r requirements.txt
          pip install torch==2.6.0 torchaudio==2.6.0 --index-url https://download.pytorch.org/whl/cpu
          pip install chatterbox-tts
      - name: Unlock the voice sample
        env:
          VOICE_KEY: ${{ secrets.VOICE_KEY }}
        run: |
          openssl enc -d -aes-256-cbc -pbkdf2 -iter 200000 -in voice/voice_sample.wav.enc \
            -out "$RUNNER_TEMP/voice_sample.wav" -pass env:VOICE_KEY
          echo "VOICE_SAMPLE=$RUNNER_TEMP/voice_sample.wav" >> "$GITHUB_ENV"
      - name: Speak A and B
        run: |
          python - <<'PY'
          import yaml
          from pathlib import Path
          from youtube_agent import voice
          cfg = yaml.safe_load(open("youtube_agent/config.yaml"))["voice"]
          a = ("Most falls in older adults happen at home. Not outside. At home. And the most dangerous room "
               "is the one you use every single day. Here's the good news. Three small changes cut the risk a lot.")
          b = ("Most falls in older adults happen at home... not outside. At home. And the most dangerous room "
               "is the one you use - every single day. Here's the good news... three small changes cut the risk - a lot.")
          out = Path("voice_ab"); out.mkdir(exist_ok=True)
          voice.narrate_scene(a, cfg, out / "A_plain.wav")
          voice.narrate_scene(b, {**cfg, "exaggeration": 0.65}, out / "B_pauses_emphasis.wav")
          PY
          for f in voice_ab/*.wav; do ffmpeg -y -loglevel error -i "$f" -b:a 160k "${f%.wav}.mp3" && rm "$f"; done
          rm "$VOICE_SAMPLE"
      - name: Save to the previews branch
        run: |
          git config user.name "youtube-agent"
          git config user.email "youtube-agent@users.noreply.github.com"
          git fetch -q origin previews
          git checkout -q -B previews origin/previews
          mkdir -p previews/voice_ab && cp voice_ab/*.mp3 previews/voice_ab/
          git add previews/voice_ab
          git diff --cached --quiet || git commit -qm "Voice A/B test"
          git push -q origin previews
