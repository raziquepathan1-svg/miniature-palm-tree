name: Islamic channel - test my voice in Hindi/Urdu

# Makes short MP3s in your cloned voice speaking Hindi/Urdu (and Arabic) so you can listen
# before the Islamic story videos use it. Uses Chatterbox Multilingual (Hindi + Arabic; it has no
# Urdu, but simple spoken Hindi is the same as spoken Urdu).
# Needs the VOICE_KEY secret (it unlocks voice/voice_sample_hi.wav.enc, or voice/voice_sample.wav.enc). The unlocked sample is deleted
# at the end and never leaves this run.
on:
  workflow_dispatch:
    inputs:
      text:
        description: "Hindi/Urdu text to speak, in Hindi letters (leave empty for the Bismillah story test)"
        required: false
        default: ""
      speed:
        description: "Speaking speed of A1 (1.0 = as generated, 0.9 = slower; A2 is always 0.9)"
        required: false
        default: "1.0"

permissions:
  contents: read

jobs:
  test-voice:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Cache voice models
        uses: actions/cache@v4
        with:
          path: ~/.cache/huggingface
          key: voice-models-clone-multilingual-v1

      - name: Install
        run: |
          sudo apt-get update -q && sudo apt-get install -y -q ffmpeg
          pip install -q torch==2.6.0 torchaudio==2.6.0 --index-url https://download.pytorch.org/whl/cpu
          pip install -q chatterbox-tts

      - name: Set up your cloned voice
        env:
          VOICE_KEY: ${{ secrets.VOICE_KEY }}
        run: |
          if [ -z "$VOICE_KEY" ]; then echo "::error::Add the VOICE_KEY secret first."; exit 1; fi
          # The Hindi/Urdu recording (Islamic channel - save my Hindi/Urdu voice) if saved, else the English one.
          SAMPLE=voice/voice_sample_hi.wav.enc; [ -f "$SAMPLE" ] || SAMPLE=voice/voice_sample.wav.enc
          echo "Using $SAMPLE"
          openssl enc -d -aes-256-cbc -pbkdf2 -iter 200000 -in "$SAMPLE" \
            -out "$RUNNER_TEMP/voice_sample.wav" -pass env:VOICE_KEY
          echo "VOICE_SAMPLE=$RUNNER_TEMP/voice_sample.wav" >> "$GITHUB_ENV"

      - name: Speak
        env:
          TEXT: ${{ inputs.text }}
          SPEED: ${{ inputs.speed }}
        run: |
          python - <<'EOF'
          import os, re, subprocess, time
          from pathlib import Path
          import torch, torchaudio

          if not torch.cuda.is_available():  # the checkpoint was saved on GPU
              _load = torch.load
              torch.load = lambda *a, **k: _load(*a, **{**k, "map_location": "cpu"})
          torch.set_num_threads(os.cpu_count() or 4)
          from chatterbox.mtl_tts import ChatterboxMultilingualTTS

          PAUSE = 0.7  # seconds of silence after every sentence
          model = ChatterboxMultilingualTTS.from_pretrained(device="cpu")
          sample = os.environ["VOICE_SAMPLE"]
          hindi = os.environ.get("TEXT") or (
              "अस्सलामु अलैकुम दोस्तों। आज हम एक प्यारी सी कहानी सुनेंगे। "
              "छोटा अली खाना खाने बैठा, लेकिन बिस्मिल्लाह कहना भूल गया। "
              "दादू ने प्यार से कहा, बेटा, जब हम अल्लाह का नाम लेकर खाते हैं, तो खाने में बरकत आती है। "
              "अली मुस्कुराया और बोला, बिस्मिल्लाह!")
          speed = float(os.environ.get("SPEED") or 1.0)
          # name: (text, language, speed, cfg_weight)
          tests = {
              "A1_hindi_urdu_normal": (hindi, "hi", speed, 0.3),
              "A2_hindi_urdu_slower_calmer": (hindi, "hi", 0.9, 0.5),
              "B_arabic_bismillah": ("بِسْمِ اللَّهِ الرَّحْمَٰنِ الرَّحِيمِ", "ar", 1.0, 0.3),
          }
          out = Path("voice_test"); out.mkdir(exist_ok=True)
          lines = ["## Islamic channel voice test - listen to A1, A2 (Hindi/Urdu) and B (Arabic)"]
          for name, (text, lang, tempo, cfg) in tests.items():
              t = time.time()
              # One sentence at a time with a pause after each, so it stops where a sentence ends.
              sentences = [x.strip() for x in re.split(r"(?<=[।!?.])\s+", text) if x.strip()]
              parts = []
              for sentence in sentences:
                  with torch.inference_mode():
                      wav = model.generate(sentence, language_id=lang, audio_prompt_path=sample,
                                           exaggeration=0.5, cfg_weight=cfg)
                  parts += [wav.cpu(), torch.zeros(1, int(PAUSE * model.sr))]
              wav = torch.cat(parts, dim=1)
              torchaudio.save(str(out / f"{name}.wav"), wav, model.sr)
              subprocess.run(["ffmpeg", "-y", "-loglevel", "error", "-i", str(out / f"{name}.wav"),
                              "-af", f"atempo={tempo}", "-b:a", "160k", str(out / f"{name}.mp3")], check=True)
              (out / f"{name}.wav").unlink()
              dur, took = wav.shape[-1] / model.sr / tempo, time.time() - t
              print(f"{name}: speed {tempo}, cfg_weight {cfg}: {dur:.1f} s in {took:.0f} s")
              lines.append(f"- **{name}**: speed {tempo}, cfg_weight {cfg}, {dur:.1f} s")
          with open(os.environ["GITHUB_STEP_SUMMARY"], "a") as f:
              f.write("\n".join(lines) + "\n")
          EOF

      - name: Delete the unlocked voice sample
        if: always()
        run: rm -f "$RUNNER_TEMP/voice_sample.wav"

      - name: Save the test for listening
        uses: actions/upload-artifact@v4
        with:
          name: islamic-voice-test
          path: voice_test/
          retention-days: 3
