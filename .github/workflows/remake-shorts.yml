name: Remake Shorts

# Owner, Nov 12: makes a video's Shorts (and Reels) again when one of their pages was wrong. Uploads them PRIVATE,
# saves the files as an artifact for the check; publish them afterwards with publish-now.yml.
on:
  workflow_dispatch:
    inputs:
      video_id:
        description: "YouTube ID of the full video"
        required: true
      slots:
        description: "Which Shorts to remake (1,2,3)"
        default: "1,2,3"

permissions:
  contents: write

concurrency:
  group: remake-shorts
  cancel-in-progress: false

jobs:
  remake:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Cache voice model and fonts
        uses: actions/cache@v4
        with:
          path: |
            ~/.cache/kokoro
            ~/.cache/yt-agent-fonts
          key: voice-model-kokoro-v1.0
      - name: Install dependencies
        run: |
          sudo apt-get update -q && sudo apt-get install -y -q ffmpeg fonts-dejavu-core
          pip install -r requirements.txt
      - name: Cache your cloned-voice model
        uses: actions/cache@v4
        with:
          path: ~/.cache/huggingface
          key: voice-models-clone-v1
      - name: Set up your cloned voice
        env:
          VOICE_KEY: ${{ secrets.VOICE_KEY }}
        run: |
          if [ -z "$VOICE_KEY" ]; then echo "VOICE_KEY not set - standard AI voice."; exit 0; fi
          pip install -q torch==2.6.0 torchaudio==2.6.0 --index-url https://download.pytorch.org/whl/cpu
          pip install -q chatterbox-tts
          openssl enc -d -aes-256-cbc -pbkdf2 -iter 200000 -in voice/voice_sample.wav.enc \
            -out "$RUNNER_TEMP/voice_sample.wav" -pass env:VOICE_KEY
          echo "VOICE_SAMPLE=$RUNNER_TEMP/voice_sample.wav" >> "$GITHUB_ENV"
      - name: Remake and upload the Shorts (private)
        env:
          PEXELS_API_KEY: ${{ secrets.PEXELS_API_KEY }}
          YOUTUBE_TOKEN_JSON: ${{ secrets.YOUTUBE_TOKEN_JSON }}
          YOUTUBE_CLIENT_ID: ${{ secrets.YOUTUBE_CLIENT_ID }}
          YOUTUBE_CLIENT_SECRET: ${{ secrets.YOUTUBE_CLIENT_SECRET }}
          YOUTUBE_REFRESH_TOKEN: ${{ secrets.YOUTUBE_REFRESH_TOKEN }}
        run: |
          git fetch -q --depth=1 origin "${{ github.ref_name }}" && git checkout FETCH_HEAD -- youtube_agent/history.json || true
          python -m youtube_agent.remake_shorts "${{ inputs.video_id }}" "${{ inputs.slots }}"
          rm -f "$VOICE_SAMPLE"
      - name: Keep the files for the check
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: remake-${{ github.run_id }}
          path: youtube_agent/output/remake/social/
          retention-days: 14
      - name: Remember the new Short IDs
        if: always()
        run: |
          git config user.name "youtube-agent"
          git config user.email "youtube-agent@users.noreply.github.com"
          git add youtube_agent/history.json
          git commit -m "Shorts remade" || exit 0
          for i in 1 2 3 4; do git pull -q --rebase origin "${{ github.ref_name }}" && git push -q origin HEAD:"${{ github.ref_name }}" && break; sleep $((i*4)); done
