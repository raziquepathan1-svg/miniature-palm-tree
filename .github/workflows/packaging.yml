name: Set title and pinned question (free mode)

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  packaging:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Set titles and descriptions
        env:
          YOUTUBE_CLIENT_ID: ${{ secrets.YOUTUBE_CLIENT_ID }}
          YOUTUBE_CLIENT_SECRET: ${{ secrets.YOUTUBE_CLIENT_SECRET }}
          YOUTUBE_REFRESH_TOKEN: ${{ secrets.YOUTUBE_REFRESH_TOKEN }}
          YOUTUBE_TOKEN_JSON: ${{ secrets.YOUTUBE_TOKEN_JSON }}
        run: |
          pip install -q google-api-python-client google-auth google-auth-oauthlib
          python -m youtube_agent.set_packaging
      - name: Remember finished jobs
        run: |
          git config user.name "youtube-agent"
          git config user.email "youtube-agent@users.noreply.github.com"
          git add youtube_agent/packaging_jobs.json youtube_agent/history.json
          git diff --cached --quiet && exit 0
          git commit -m "Record titles set" && git pull --rebase && git push
