name: Approve video

# After you have watched the preview: schedules the video (and its Shorts) that was held for your OK.
on:
  workflow_dispatch:
    inputs:
      video_id:
        description: "YouTube video ID (empty = the latest video waiting for approval)"
        required: false
        default: ""

permissions:
  contents: write

jobs:
  approve:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Schedule it
        env:
          YOUTUBE_TOKEN_JSON: ${{ secrets.YOUTUBE_TOKEN_JSON }}
          YOUTUBE_CLIENT_ID: ${{ secrets.YOUTUBE_CLIENT_ID }}
          YOUTUBE_CLIENT_SECRET: ${{ secrets.YOUTUBE_CLIENT_SECRET }}
          YOUTUBE_REFRESH_TOKEN: ${{ secrets.YOUTUBE_REFRESH_TOKEN }}
        run: |
          pip install -q -r requirements.txt
          python -m youtube_agent.approve ${{ inputs.video_id }}

      - name: Save
        run: |
          git config user.name "youtube-agent"
          git config user.email "youtube-agent@users.noreply.github.com"
          git add youtube_agent/history.json
          git commit -m "Approved video scheduled" || exit 0
          for i in 1 2 3; do git pull --rebase && git push && break; sleep 5; done
