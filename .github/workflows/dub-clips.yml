name: Intro/outro in your cloned voice

# Re-voices the spoken intro/outro clips with your cloned voice (the same voice as the narration):
# the clone says the same words at the normal narration pace, and LatentSync (Kaggle's free GPU) moves the lips
# to the new voice. Writes <name>_dub.mp4 in speaking/.
on:
  workflow_dispatch:
    inputs:
      files:
        description: "Clips to re-voice, space-separated paths (empty = every intro/outro in config.yaml)"
        required: false
        default: ""

permissions:
  contents: write

jobs:
  dub:
    runs-on: ubuntu-latest
    timeout-minutes: 150
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Cache voice models
        uses: actions/cache@v4
        with:
          path: ~/.cache/huggingface
          key: voice-models-clone-v1

      - name: Install
        run: |
          sudo apt-get update -q && sudo apt-get install -y -q ffmpeg
          pip install -q -r requirements.txt faster-whisper kaggle
          pip install -q torch==2.6.0 torchaudio==2.6.0 --index-url https://download.pytorch.org/whl/cpu
          pip install -q chatterbox-tts

      - name: Unlock the voice sample
        env:
          VOICE_KEY: ${{ secrets.VOICE_KEY }}
        run: |
          openssl enc -d -aes-256-cbc -pbkdf2 -iter 200000 -in voice/voice_sample.wav.enc \
            -out "$RUNNER_TEMP/voice_sample.wav" -pass env:VOICE_KEY
          echo "VOICE_SAMPLE=$RUNNER_TEMP/voice_sample.wav" >> "$GITHUB_ENV"

      - name: Re-voice the clips
        env:
          FILES: ${{ inputs.files }}
          KAGGLE_USERNAME: ${{ secrets.KAGGLE_USERNAME }}
          KAGGLE_KEY: ${{ secrets.KAGGLE_KEY }}
          KAGGLE_API_TOKEN: ${{ secrets.KAGGLE_API_TOKEN }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}  # voice files for Kaggle, previews
        run: |
          [ -z "$KAGGLE_KEY" ] && unset KAGGLE_KEY
          [ -z "$KAGGLE_API_TOKEN" ] && unset KAGGLE_API_TOKEN
          python -m youtube_agent.dub_clips $FILES
          rm -f "$VOICE_SAMPLE"
          cat branding/health-support-studio/avatar/speaking/dub_report.txt >> "$GITHUB_STEP_SUMMARY"

      - name: Save
        run: |
          git config user.name "youtube-agent"
          git config user.email "youtube-agent@users.noreply.github.com"
          git add branding/health-support-studio/avatar/speaking
          git commit -m "Intro/outro clips in your cloned voice" || exit 0
          for i in 1 2 3; do git pull --rebase && git push && break; sleep 5; done
