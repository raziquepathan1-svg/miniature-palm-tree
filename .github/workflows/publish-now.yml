name: Publish now

# Makes videos/Shorts public right away (instead of at their scheduled time).
on:
  workflow_dispatch:
    inputs:
      video_ids:
        description: "YouTube video IDs, separated by spaces or commas"
        required: true

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Publish
        env:
          YOUTUBE_TOKEN_JSON: ${{ secrets.YOUTUBE_TOKEN_JSON }}
          YOUTUBE_CLIENT_ID: ${{ secrets.YOUTUBE_CLIENT_ID }}
          YOUTUBE_CLIENT_SECRET: ${{ secrets.YOUTUBE_CLIENT_SECRET }}
          YOUTUBE_REFRESH_TOKEN: ${{ secrets.YOUTUBE_REFRESH_TOKEN }}
          VIDEO_IDS: ${{ inputs.video_ids }}
        run: |
          pip install -q -r requirements.txt
          python -m youtube_agent.publish_now $VIDEO_IDS

      - name: Save
        run: |
          git config user.name "youtube-agent"
          git config user.email "youtube-agent@users.noreply.github.com"
          git add youtube_agent/history.json
          git commit -m "Published now" || exit 0
          for i in 1 2 3; do git pull --rebase && git push && break; sleep 5; done
