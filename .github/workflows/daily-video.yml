name: Daily YouTube video

on:
  schedule:
    # Twice a day, timed for US viewers -> 2 videos/day with videos_per_run: 1.
    # Cron times are UTC. Rendering takes ~20-40 min, so videos go live around
    # 12 PM and 6 PM Eastern (9 AM / 3 PM Pacific) during daylight saving time,
    # one hour earlier in winter. Delete one line for 1 video/day.
    - cron: "17 15 * * *"
    - cron: "17 21 * * *"
  workflow_dispatch:
    inputs:
      topic:
        description: "Optional: exact topic for this video"
        required: false
      dry_run:
        description: "Make the video but don't upload"
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: daily-video
  cancel-in-progress: false

jobs:
  make-video:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          sudo apt-get update -q && sudo apt-get install -y -q ffmpeg fonts-dejavu-core
          pip install -r requirements.txt

      - name: Make and upload video
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          HEYGEN_API_KEY: ${{ secrets.HEYGEN_API_KEY }}
          HEYGEN_AVATAR_ID: ${{ secrets.HEYGEN_AVATAR_ID }}
          HEYGEN_VOICE_ID: ${{ secrets.HEYGEN_VOICE_ID }}
          YOUTUBE_TOKEN_JSON: ${{ secrets.YOUTUBE_TOKEN_JSON }}
          TOPIC: ${{ inputs.topic }}
          DRY_RUN: ${{ inputs.dry_run }}
        run: |
          ARGS=()
          if [ -n "$TOPIC" ]; then ARGS+=(--topic "$TOPIC"); fi
          if [ "$DRY_RUN" = "true" ]; then ARGS+=(--dry-run); fi
          python -m youtube_agent.main "${ARGS[@]}"

      - name: Save video files for review
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: video-${{ github.run_id }}
          path: youtube_agent/output/
          retention-days: 7
          if-no-files-found: ignore

      - name: Remember published topics
        if: always()
        run: |
          git config user.name "youtube-agent"
          git config user.email "youtube-agent@users.noreply.github.com"
          git add youtube_agent/history.json 2>/dev/null || exit 0
          git diff --cached --quiet && exit 0
          git commit -m "Record published video"
          git pull --rebase && git push
