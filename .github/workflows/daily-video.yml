name: Daily YouTube video

on:
  schedule:
    # Once a day (1 video/day) at 03:17 UTC = ~6:17 AM Saudi time. The video is ready
    # ~20-40 min later, scheduled to go public at 12:00 New York time (7 PM Saudi),
    # which leaves the whole day to review it in the YouTube Studio app.
    - cron: "17 3 * * *"
  workflow_dispatch:
    inputs:
      topic:
        description: "Optional: exact topic for this video"
        required: false
      dry_run:
        description: "Make the video but don't upload"
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: daily-video
  cancel-in-progress: false

jobs:
  make-video:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Cache voice model and fonts
        uses: actions/cache@v4
        with:
          path: |
            ~/.cache/kokoro
            ~/.cache/yt-agent-fonts
          key: voice-model-kokoro-v1.0

      - name: Install dependencies
        run: |
          sudo apt-get update -q && sudo apt-get install -y -q ffmpeg fonts-dejavu-core
          pip install -r requirements.txt

      - name: Make and upload video
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          PEXELS_API_KEY: ${{ secrets.PEXELS_API_KEY }}
          HEYGEN_API_KEY: ${{ secrets.HEYGEN_API_KEY }}
          HEYGEN_AVATAR_ID: ${{ secrets.HEYGEN_AVATAR_ID }}
          HEYGEN_VOICE_ID: ${{ secrets.HEYGEN_VOICE_ID }}
          YOUTUBE_TOKEN_JSON: ${{ secrets.YOUTUBE_TOKEN_JSON }}
          YOUTUBE_CLIENT_ID: ${{ secrets.YOUTUBE_CLIENT_ID }}
          YOUTUBE_CLIENT_SECRET: ${{ secrets.YOUTUBE_CLIENT_SECRET }}
          YOUTUBE_REFRESH_TOKEN: ${{ secrets.YOUTUBE_REFRESH_TOKEN }}
          TOPIC: ${{ inputs.topic }}
          DRY_RUN: ${{ inputs.dry_run }}
        run: |
          ARGS=()
          if [ -n "$TOPIC" ]; then ARGS+=(--topic "$TOPIC"); fi
          if [ "$DRY_RUN" = "true" ]; then ARGS+=(--dry-run); fi
          python -m youtube_agent.main "${ARGS[@]}"

      - name: Save video files for review
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: video-${{ github.run_id }}
          path: youtube_agent/output/
          retention-days: 7
          if-no-files-found: ignore

      - name: Save the Short for Instagram/Facebook
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: social-${{ github.run_id }}
          path: youtube_agent/output/*/social/
          retention-days: 7
          if-no-files-found: ignore

      - name: Remember published topics
        if: always()
        run: |
          git config user.name "youtube-agent"
          git config user.email "youtube-agent@users.noreply.github.com"
          git add youtube_agent/history.json 2>/dev/null || exit 0
          git diff --cached --quiet && exit 0
          git commit -m "Record published video"
          git pull --rebase && git push
