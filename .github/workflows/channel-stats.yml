name: Channel stats

# Prints subscribers and the views/likes/comments of recent uploads (read-only).
on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  stats:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install -q -r requirements.txt
      - env:
          YOUTUBE_TOKEN_JSON: ${{ secrets.YOUTUBE_TOKEN_JSON }}
          YOUTUBE_CLIENT_ID: ${{ secrets.YOUTUBE_CLIENT_ID }}
          YOUTUBE_CLIENT_SECRET: ${{ secrets.YOUTUBE_CLIENT_SECRET }}
          YOUTUBE_REFRESH_TOKEN: ${{ secrets.YOUTUBE_REFRESH_TOKEN }}
        run: python -m youtube_agent.stats | tee stats.txt
      - name: Save to the previews branch
        run: |
          git config user.name "youtube-agent"
          git config user.email "youtube-agent@users.noreply.github.com"
          git fetch -q origin previews
          git checkout -q -B previews origin/previews
          mkdir -p previews && cp stats.txt previews/stats.txt
          git add previews/stats.txt
          git diff --cached --quiet || git commit -qm "Channel stats"
          git push -q origin previews
