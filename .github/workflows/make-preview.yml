name: Make preview again

# If a daily run could not save its 360p preview (e.g. a GitHub hiccup), this makes it from the run's
# saved video files and puts it on the "previews" branch.
on:
  workflow_dispatch:
    inputs:
      run_id:
        description: "Daily video run ID"
        required: true
      video_id:
        description: "YouTube video ID"
        required: true
      shorts:
        description: "Also save the run's Shorts (social files) next to the preview"
        type: boolean
        default: false

permissions:
  contents: write
  actions: read

jobs:
  preview:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Download the run's video files
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh run download "${{ inputs.run_id }}" --repo "$GITHUB_REPOSITORY" --name "video-${{ inputs.run_id }}" --dir dl
          if [ "${{ inputs.shorts }}" = "true" ]; then
            gh run download "${{ inputs.run_id }}" --repo "$GITHUB_REPOSITORY" --name "social-${{ inputs.run_id }}" --dir soc || true
          fi
      - name: Make and save the preview
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          command -v ffmpeg >/dev/null || { sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg; }
          pip install -q requests pillow numpy pyyaml
          f=$(find dl -name final.mp4 -not -path "*short*" | head -1)
          [ -n "$f" ] || { echo "No final.mp4 in the run's files"; exit 1; }
          ffmpeg -y -loglevel error -i "$f" -vf scale=-2:360 -c:v libx264 -preset veryfast -b:v 350k -c:a aac -b:a 64k preview.mp4
          ls -la preview.mp4
          git config user.name "youtube-agent"
          git config user.email "youtube-agent@users.noreply.github.com"
          git fetch -q origin previews
          git checkout -q -B previews origin/previews
          mkdir -p previews && cp preview.mp4 "previews/${{ inputs.video_id }}.mp4"
          if [ -d soc ]; then
            for n in short reel reel2; do
              f=$(find soc -name "$n.mp4" | head -1)
              if [ -n "$f" ]; then ffmpeg -y -loglevel error -i "$f" -vf scale=-2:640 -c:v libx264 -preset veryfast -b:v 600k -c:a aac -b:a 64k "previews/${{ inputs.video_id }}_$n.mp4"; fi
            done
            for j in $(find soc -name "*.json"); do cp "$j" "previews/${{ inputs.video_id }}_$(basename "$j")"; done
          fi
          git add previews
          git diff --cached --quiet || git commit -qm "Add previews for ${{ inputs.video_id }}"
          git push -q origin previews
