name: Make preview again

# If a daily run could not save its 360p preview (e.g. a GitHub hiccup), this makes it from the run's
# saved video files and puts it on the "previews" branch.
on:
  workflow_dispatch:
    inputs:
      run_id:
        description: "Daily video run ID"
        required: true
      video_id:
        description: "YouTube video ID"
        required: true

permissions:
  contents: write
  actions: read

jobs:
  preview:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Download the run's video files
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh run download "${{ inputs.run_id }}" --repo "$GITHUB_REPOSITORY" --name "video-${{ inputs.run_id }}" --dir dl
      - name: Make and save the preview
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          command -v ffmpeg >/dev/null || { sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg; }
          pip install -q requests
          f=$(find dl -name final.mp4 -not -path "*short*" | head -1)
          [ -n "$f" ] || { echo "No final.mp4 in the run's files"; exit 1; }
          ffmpeg -y -loglevel error -i "$f" -vf scale=-2:360 -c:v libx264 -preset veryfast -b:v 350k -c:a aac -b:a 64k preview.mp4
          python - <<'PY'
          from pathlib import Path
          from youtube_agent.talking import upload_to_branch
          vid = "${{ inputs.video_id }}"
          print(upload_to_branch("previews", f"previews/{vid}.mp4", Path("preview.mp4").read_bytes()))
          PY
