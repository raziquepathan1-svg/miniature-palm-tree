name: Post Short to Instagram and Facebook

on:
  schedule:
    # Two Reels a day, each only once its YouTube video is public:
    # 23:35 UTC = ~7:30 PM New York (evening, when US viewers scroll most): the main Reel (slot 1).
    # 17:25 UTC = ~1:25 PM New York (lunch): the second Reel, cut from the video's best scene (slot 2).
    - cron: "35 23 * * *"
    - cron: "25 17 * * *"
  workflow_dispatch:
    inputs:
      slot:
        description: "Which Reel: 1 = main Reel, 2 = second Reel"
        type: choice
        options: ["1", "2"]
        default: "1"
      check_only:
        description: "Only test the Facebook/Instagram connection (posts nothing)"
        type: boolean
        default: false
      instagram_only:
        description: "Re-post the latest Short to Instagram only (after an Instagram failure)"
        type: boolean
        default: false

permissions:
  contents: write
  actions: read

concurrency:
  group: social-post
  cancel-in-progress: false

jobs:
  post:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Test the connection only
        if: inputs.check_only
        env:
          META_PAGE_ID: ${{ secrets.META_PAGE_ID }}
          META_PAGE_TOKEN: ${{ secrets.META_PAGE_TOKEN }}
          IG_USER_ID: ${{ secrets.IG_USER_ID }}
        run: |
          pip install -q requests
          python -m youtube_agent.social --check

      - name: Find the newest Short whose YouTube video is public
        if: ${{ !inputs.check_only }}
        id: find
        env:
          GH_TOKEN: ${{ github.token }}
          SLOT: ${{ github.event.schedule == '25 17 * * *' && '2' || inputs.slot || '1' }}
        run: |
          echo "slot=$SLOT" >> "$GITHUB_OUTPUT"
          MARK=$([ "$SLOT" = "2" ] && echo "-2" || echo "")
          # Videos are scheduled a day ahead, so the newest run's video is usually not public yet.
          # Walk back through recent runs (newest first) and take the first one that is due.
          now=$(date -u +%s)
          # Any finished run counts (a run can upload fine and then fail at its last git step); a video that
          # is not in history.json (a duplicate, a dry run) is skipped below.
          for RUN_ID in $(gh run list --repo "$GITHUB_REPOSITORY" --workflow daily-video.yml --status completed \
                          --limit 8 --json databaseId --jq '.[].databaseId'); do
            if [ "${{ inputs.instagram_only }}" != "true" ] && grep -qx "$RUN_ID$MARK" youtube_agent/social_posted.txt 2>/dev/null; then
              echo "Newest due Short (run $RUN_ID) was already posted."; break
            fi
            rm -rf social_dl && mkdir social_dl
            gh run download "$RUN_ID" --repo "$GITHUB_REPOSITORY" --name "social-$RUN_ID" --dir social_dl 2>/dev/null || continue
            f=$(find social_dl -name social.json | head -1)
            [ -n "$f" ] || continue
            if [ "$SLOT" = "2" ] && [ ! -f "$(dirname "$f")/reel2.mp4" ]; then
              echo "Run $RUN_ID has no second Reel."; continue
            fi
            # The publish time is in history.json (videos held for approval get it only when approved).
            at=$(python3 - "$f" <<'PY2'
          import json, sys
          meta = json.load(open(sys.argv[1]))
          hist = {h.get("youtube_id"): h for h in json.load(open("youtube_agent/history.json")) if h.get("youtube_id")}
          for h in list(hist.values()):  # a video replaced after upload (e.g. presenter added): follow the new ID
              for old in h.get("replaced_ids", []):
                  hist[old] = h
          h = hist.get(meta.get("youtube_id"), {})
          if h.get("youtube_id") and h["youtube_id"] != meta.get("youtube_id"):
              meta["youtube_id"] = h["youtube_id"]
              json.dump(meta, open(sys.argv[1], "w"), indent=2)
          print("unknown" if not h else "waiting" if h.get("awaiting_approval")
                else (h.get("publish_at") or meta.get("publish_at") or ""))
          PY2
          )
            if [ "$at" = "waiting" ]; then echo "Run $RUN_ID: video still waiting for approval."; continue; fi
            if [ "$at" = "unknown" ]; then echo "Run $RUN_ID: its video is not in history.json - skipped."; continue; fi
            if [ -z "$at" ] || [ "$(date -u -d "$at" +%s)" -le "$now" ]; then
              echo "Posting the Short from run $RUN_ID (YouTube video public since ${at:-upload})."
              echo "run_id=$RUN_ID" >> "$GITHUB_OUTPUT"
              exit 0
            fi
            echo "Run $RUN_ID: YouTube video goes public at $at - not yet."
          done
          echo "skip=true" >> "$GITHUB_OUTPUT"
          echo "No Short is ready to post right now."

      - uses: actions/setup-python@v5
        if: ${{ !inputs.check_only && steps.find.outputs.skip != 'true' }}
        with:
          python-version: "3.11"

      - name: Post to Instagram and Facebook
        if: ${{ !inputs.check_only && steps.find.outputs.skip != 'true' }}
        env:
          META_PAGE_ID: ${{ secrets.META_PAGE_ID }}
          META_PAGE_TOKEN: ${{ secrets.META_PAGE_TOKEN }}
          IG_USER_ID: ${{ secrets.IG_USER_ID }}
          ONLY_INSTAGRAM: ${{ inputs.instagram_only }}
          SOCIAL_SLOT: ${{ steps.find.outputs.slot }}
          YOUTUBE_CLIENT_ID: ${{ secrets.YOUTUBE_CLIENT_ID }}
          YOUTUBE_CLIENT_SECRET: ${{ secrets.YOUTUBE_CLIENT_SECRET }}
          YOUTUBE_REFRESH_TOKEN: ${{ secrets.YOUTUBE_REFRESH_TOKEN }}
          YOUTUBE_TOKEN_JSON: ${{ secrets.YOUTUBE_TOKEN_JSON }}
        run: |
          command -v ffmpeg >/dev/null || { sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg; }
          pip install -q requests google-api-python-client google-auth google-auth-oauthlib
          DIR=$(dirname "$(find social_dl -name social.json | head -1)")
          if [ "$DIR" = "." ] || [ -z "$DIR" ]; then echo "No social.json in the artifact - nothing to post."; exit 0; fi
          # Owner, Oct 29: never post a Reel with a sound problem - check the whole file first
          for f in "$DIR"/reel*.mp4; do
            [ -f "$f" ] || continue
            pip install -q numpy
            if ! python -m youtube_agent.sound_check "$f"; then
              echo "::error::Sound check failed for $f - NOT posting. Check the sound and fix the Reel first."
              exit 1
            fi
          done
          python -m youtube_agent.social "$DIR"

      - name: Remember it was posted
        if: ${{ always() && !inputs.check_only && !inputs.instagram_only && steps.find.outputs.skip != 'true' }}
        run: |
          FLAG=$([ "${{ steps.find.outputs.slot }}" = "2" ] && echo posted2.flag || echo posted.flag)
          MARK=$([ "${{ steps.find.outputs.slot }}" = "2" ] && echo "-2" || echo "")
          find social_dl -name "$FLAG" | grep -q . || { echo "Nothing was posted."; exit 0; }
          echo "${{ steps.find.outputs.run_id }}$MARK" >> youtube_agent/social_posted.txt
          git config user.name "youtube-agent"
          git config user.email "youtube-agent@users.noreply.github.com"
          git add youtube_agent/social_posted.txt
          git commit -m "Record posted Short" && { for i in 1 2 3 4 5; do git pull --rebase && git push && exit 0; git rebase --abort 2>/dev/null || true; sleep $((i*4)); done; exit 1; }
