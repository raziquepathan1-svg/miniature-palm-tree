name: Niche scan

# Public view counts of other health channels' latest 50 videos (for the yt-viral skill).
on:
  workflow_dispatch:
    inputs:
      handles:
        description: "Channel handles, space separated"
        required: true
        default: "@ClevelandClinic @mayoclinic @DoctorMike @InstituteofHumanAnatomy @HopkinsMedicine @drsanjaygupta"

permissions:
  contents: write

jobs:
  scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Scan
        env:
          YOUTUBE_TOKEN_JSON: ${{ secrets.YOUTUBE_TOKEN_JSON }}
          YOUTUBE_CLIENT_ID: ${{ secrets.YOUTUBE_CLIENT_ID }}
          YOUTUBE_CLIENT_SECRET: ${{ secrets.YOUTUBE_CLIENT_SECRET }}
          YOUTUBE_REFRESH_TOKEN: ${{ secrets.YOUTUBE_REFRESH_TOKEN }}
          HANDLES: ${{ inputs.handles }}
        run: |
          pip install -q -r requirements.txt
          python -m youtube_agent.niche_scan $HANDLES

      - name: Save
        run: |
          git config user.name "youtube-agent"
          git config user.email "youtube-agent@users.noreply.github.com"
          git add youtube_agent/niche.json
          git commit -m "Niche scan" || exit 0
          for i in 1 2 3 4 5; do git pull --rebase && git push && exit 0; git rebase --abort 2>/dev/null; sleep $((i*4)); done; exit 1
