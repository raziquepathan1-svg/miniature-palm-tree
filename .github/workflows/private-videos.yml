name: Private videos

# Lists the channel's private/scheduled videos; with "delete" set, deletes those stray copies
# (only private ones that are not in history.json).
on:
  workflow_dispatch:
    inputs:
      delete:
        description: "Video IDs to delete (space separated). Empty = only list."
        required: false
        default: ""

permissions:
  contents: read

jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: List or delete
        env:
          YOUTUBE_TOKEN_JSON: ${{ secrets.YOUTUBE_TOKEN_JSON }}
          YOUTUBE_CLIENT_ID: ${{ secrets.YOUTUBE_CLIENT_ID }}
          YOUTUBE_CLIENT_SECRET: ${{ secrets.YOUTUBE_CLIENT_SECRET }}
          YOUTUBE_REFRESH_TOKEN: ${{ secrets.YOUTUBE_REFRESH_TOKEN }}
          DELETE_IDS: ${{ inputs.delete }}
        run: |
          pip install -q -r requirements.txt
          if [ -n "$DELETE_IDS" ]; then python -m youtube_agent.private_videos --delete $DELETE_IDS; fi
          python -m youtube_agent.private_videos
