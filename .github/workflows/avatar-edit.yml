name: Avatar - change outfit (Gemini)

# Edits branding/health-support-studio/avatar/original.jpg with the Gemini image model (GEMINI_API_KEY)
# and commits the results next to it, so the owner can pick one for thumbnails.
on:
  workflow_dispatch:
    inputs:
      prompt:
        description: "What to change"
        required: false
        default: ""
      count:
        description: "How many versions to try"
        required: false
        default: "3"

permissions:
  contents: write

jobs:
  edit:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Edit the photo
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          PROMPT: ${{ inputs.prompt }}
          COUNT: ${{ inputs.count }}
        run: |
          pip install -q requests pillow
          python - <<'EOF'
          import base64, io, os, time
          from pathlib import Path
          import requests
          from PIL import Image
          d = Path("branding/health-support-studio/avatar")
          src = (d / "original.jpg").read_bytes()
          prompt = os.environ.get("PROMPT") or (
              "Edit this photo. Keep the man's face, eyes, hair, beard, skin tone, body shape and standing pose exactly "
              "the same; he must be clearly recognisable as the same person. Change only his clothes and the background: "
              "he wears clean navy-blue hospital ICU nurse scrubs (V-neck top and matching trousers) with a stethoscope "
              "around his neck and a small ID badge clipped to the top. Background: a bright, softly blurred modern "
              "hospital corridor. Natural, friendly, professional look, realistic photo, high detail, no text.")
          key = os.environ["GEMINI_API_KEY"].strip()
          models = ["gemini-2.5-flash-image", "gemini-2.5-flash-image-preview"]
          n, made = int(os.environ.get("COUNT") or 3), 0
          for i in range(n * 3):
              if made >= n:
                  break
              body = {"contents": [{"parts": [{"text": prompt}, {"inline_data": {"mime_type": "image/jpeg",
                      "data": base64.b64encode(src).decode()}}]}],
                      "generationConfig": {"responseModalities": ["IMAGE"]}}
              m = models[min(i // 3, len(models) - 1)]
              r = requests.post(f"https://generativelanguage.googleapis.com/v1beta/models/{m}:generateContent",
                                headers={"x-goog-api-key": key}, json=body, timeout=180)
              if r.status_code >= 400:
                  print(f"try {i + 1} ({m}): {r.status_code} {r.text[:200]}")
                  time.sleep(20 * (i + 1))
                  continue
              for c in r.json().get("candidates", []):
                  for p in (c.get("content") or {}).get("parts", []):
                      data = (p.get("inlineData") or p.get("inline_data") or {}).get("data")
                      if data:
                          made += 1
                          Image.open(io.BytesIO(base64.b64decode(data))).convert("RGB").save(
                              d / f"nurse_{made}.jpg", quality=94)
                          print(f"Saved nurse_{made}.jpg")
          if not made:
              raise SystemExit("Gemini made no image (free quota used up? try again later)")
          EOF
      - name: Save the new pictures
        run: |
          git config user.name "youtube-agent"
          git config user.email "youtube-agent@users.noreply.github.com"
          git add branding/health-support-studio/avatar
          git commit -m "Avatar: nurse-scrubs versions" && git pull --rebase && git push
