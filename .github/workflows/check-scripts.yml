name: Check script bank

on:
  workflow_dispatch:
  push:
    paths:
      - "youtube_agent/script_bank/**"

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install -r requirements.txt
      - run: python -m youtube_agent.check_scripts --links
