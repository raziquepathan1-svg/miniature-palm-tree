name: Restore Remake Studio - daily video

on:
  # Uploading clips into rrs_inbox/ starts a run right away.
  push:
    branches: [claude/kind-albattani-59hcns]
    paths: ["rrs_inbox/**", "!rrs_inbox/*.md"]
  schedule:
    # Every 6 hours: picks up makeovers still waiting (one per run) and makes the long compilation once
    # enough makeovers are ready.
    - cron: "7 */6 * * *"
  workflow_dispatch:
    inputs:
      mode:
        description: "clips = Short from rrs_inbox; compile = long compilation now; images = old AI-image makeover"
        type: choice
        options: [clips, compile, images]
        default: clips
      dry_run:
        description: "Make the video but don't upload"
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: restore-daily-video
  cancel-in-progress: false

env:
  CHANNEL: restore_remake

jobs:
  make-video:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 30   # to see when each clip was uploaded

      - name: Use the newest files
        # A run that waited in the queue would otherwise work on the files as they were when it was started,
        # and re-make a makeover the previous run already published.
        run: git fetch -q origin "${{ github.ref_name }}" && git reset -q --hard FETCH_HEAD

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Cache voice model and fonts
        uses: actions/cache@v4
        with:
          path: |
            ~/.cache/kokoro
            ~/.cache/yt-agent-fonts
          key: voice-model-kokoro-v1.0

      - name: Install dependencies
        run: |
          sudo apt-get update -q && sudo apt-get install -y -q ffmpeg fonts-dejavu-core
          pip install -r requirements.txt

      - name: Cache your cloned-voice model
        uses: actions/cache@v4
        with:
          path: ~/.cache/huggingface
          key: voice-models-clone-v1

      - name: Set up your cloned voice
        env:
          VOICE_KEY: ${{ secrets.VOICE_KEY }}
        run: |
          # Without the key the videos use the standard AI voice (config: voice.fallback_voice).
          if [ -z "$VOICE_KEY" ]; then echo "VOICE_KEY not set - standard AI voice."; exit 0; fi
          pip install -q torch==2.6.0 torchaudio==2.6.0 --index-url https://download.pytorch.org/whl/cpu
          pip install -q chatterbox-tts
          openssl enc -d -aes-256-cbc -pbkdf2 -iter 200000 -in voice/voice_sample.wav.enc \
            -out "$RUNNER_TEMP/voice_sample.wav" -pass env:VOICE_KEY
          echo "VOICE_SAMPLE=$RUNNER_TEMP/voice_sample.wav" >> "$GITHUB_ENV"

      - name: Make and upload the makeover video
        id: make
        env:
          # AI images: Gemini if this secret is set, otherwise the free Pollinations service.
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          # Same Google Cloud app as Health Support Studio; only the login (refresh token) is this channel's.
          YOUTUBE_CLIENT_ID: ${{ secrets.RRS_YOUTUBE_CLIENT_ID || secrets.YOUTUBE_CLIENT_ID }}
          YOUTUBE_CLIENT_SECRET: ${{ secrets.RRS_YOUTUBE_CLIENT_SECRET || secrets.YOUTUBE_CLIENT_SECRET }}
          YOUTUBE_REFRESH_TOKEN: ${{ secrets.RRS_YOUTUBE_REFRESH_TOKEN }}
          DRY_RUN: ${{ inputs.dry_run }}
        run: |
          ARGS=()
          if [ "$DRY_RUN" = "true" ]; then
            ARGS+=(--dry-run)
          elif [ -z "$YOUTUBE_REFRESH_TOKEN" ]; then
            # Never fall back to another channel's login.
            echo "## Restore Remake Studio is not connected to YouTube yet" >> "$GITHUB_STEP_SUMMARY"
            echo "Add the RRS_YOUTUBE_REFRESH_TOKEN secret (see youtube_agent/channels/restore_remake/SETUP.md). Nothing was uploaded." >> "$GITHUB_STEP_SUMMARY"
            echo "RRS_YOUTUBE_REFRESH_TOKEN is not set - skipping."
            exit 0
          fi
          MODE="${{ inputs.mode || 'clips' }}"
          if [ "$MODE" = "images" ]; then
            python -m youtube_agent.makeover "${ARGS[@]}"
          elif [ "$MODE" = "compile" ]; then
            python -m youtube_agent.clips --compile --force "${ARGS[@]}"
          else
            python -m youtube_agent.clips "${ARGS[@]}"
            # long compilation once enough makeovers are ready (scheduled runs only)
            if [ "${{ github.event_name }}" = "schedule" ]; then python -m youtube_agent.clips --compile "${ARGS[@]}"; fi
          fi

      - name: Save video files for review
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: rr-video-${{ github.run_id }}
          path: youtube_agent/output/
          retention-days: 7
          if-no-files-found: ignore

      - name: Save the Short for Instagram/Facebook
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: rr-social-${{ github.run_id }}
          path: youtube_agent/output/*/social/
          retention-days: 7
          if-no-files-found: ignore

      - name: Remember published topics
        if: ${{ always() && inputs.dry_run != true }}
        run: |
          git config user.name "youtube-agent"
          git config user.email "youtube-agent@users.noreply.github.com"
          git add -A youtube_agent/channels/restore_remake/history.json rrs_inbox rrs_clips 2>/dev/null || true
          git diff --cached --quiet && exit 0
          git commit -m "Record published Restore Remake Studio makeover"
          git pull --rebase && git push
