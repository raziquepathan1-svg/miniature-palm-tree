# ---- Your channel ----
channel:
  name: "Health Support Studio"   # shown on the graphics and thumbnails
  # What your channel teaches. The agent picks every topic from inside this niche.
  niche: >-
    Everyday health and medical topics made simple: understanding common conditions, symptoms and
    when to see a doctor, medications and safety, prevention and healthy habits, first aid,
    making sense of tests and hospital visits, and navigating the US healthcare system.
  presenter: "the host of Health Support Studio, a friendly, trustworthy health educator (do not call the host a nurse or doctor)"
  audience: "Adults in the United States, including patients, caregivers and parents, age 18+"
  country: "United States"     # target market: American spelling, examples, units and references
  language: "English"
  language_code: "en-US"       # tells YouTube the video's language
  tone: "Warm, calm, reassuring health educator; plain language, no jargon without explaining it"
  # Extra rules for every script (health content has to be careful).
  content_rules: |-
    - Educational only: never diagnose, never give personal medical advice, never tell viewers to
      start, stop or change a medication. Encourage talking to their doctor, nurse or pharmacist.
    - Follow current US guidance (CDC, NIH, FDA, USPSTF, major medical associations). No unproven
      treatments, no "miracle cures", no fear-mongering.
    - Always include red-flag symptoms that need urgent care when relevant ("call 911 if...").
    - Never invent personal stories, patient cases or quotes. Do not mention the presenter's profession
      or claim personal experiences.
    - End the video with a short spoken reminder that the video is for education, not medical advice.
  # Every video is added to one of these YouTube playlists (created automatically).
  playlists:
    - "Heart & Blood Pressure"
    - "Diabetes & Metabolism"
    - "Emergencies & First Aid"
    - "Medications & Safety"
    - "Tests & Doctor Visits"
    - "Healthy Habits & Prevention"
    - "Infections & Vaccines"
    - "Kids & Family Health"
    - "Older Adults & Caregiving"
  # Topics covered first, in order. After these, the agent picks new topics itself.
  topic_queue:
    - "High blood pressure: what the numbers mean and how to lower it"
    - "Heart attack warning signs, and how they can differ in women"
    - "Stroke signs: BE FAST and why every minute matters"
    - "Type 2 diabetes vs prediabetes: what your A1C means"
    - "How to read your blood test results (CBC and metabolic panel)"
    - "Antibiotics: why they don't work on colds and flu"
    - "Dehydration: signs to watch for in kids and older adults"
    - "Fever in children: when to worry and when to call the doctor"
    - "Urgent care vs the ER: which one do you need?"
    - "How to get the most out of a 15-minute doctor's appointment"
    - "Over-the-counter pain relievers: acetaminophen vs ibuprofen safety"
    - "How to prevent a fall at home for older adults"
    - "Sleep: how much you really need and how to improve it"
    - "What to know before going to the hospital"
    - "Hand-only CPR: how to save a life in 2 minutes"
    - "Sepsis: the emergency most people have never heard of"
    - "Cholesterol explained: LDL, HDL and triglycerides"
    - "Why you should keep an up-to-date medication list"
    - "Seasonal flu and vaccines: myths vs facts"
    - "Caring for a loved one after hospital discharge"

# ---- Video ----
video:
  # "voice_slides" = FREE: AI voice + branded graphics + stock video clips (no avatar needed)
  # "avatar"       = HeyGen talking avatar (paid HeyGen plan with API access)
  mode: "voice_slides"
  stock_footage: true          # background video clips from Pexels (free; needs PEXELS_API_KEY)
  target_minutes: 11           # spoken length of each video (10-15 min)
  format: "landscape"          # "landscape" (16:9 normal video) or "shorts" (9:16 vertical)
  videos_per_run: 1            # the GitHub schedule runs once a day -> 1 video/day
  captions: true               # burn subtitles into the video
  rotate_colors: true          # a different slide color theme for every video
  fact_check: true             # a second Claude pass checks every health claim before recording
  # Web searches during the fact-check. 0 = budget mode (about $0.25/video instead of ~$0.80):
  # Claude checks the claims from its own medical knowledge. Raise to 2-6 when you have more credit.
  fact_check_searches: 0
  background_color: "#0F172A"
  # Your spoken intro and outro (Flow clips, voice changed to your cloned voice): the intro opens every long
  # video, the outro closes every video and Short. start/end trim the clip (seconds).
  host_clips:
    intro:   # standing and sitting take turns, a different one each day
      - {file: "branding/health-support-studio/avatar/speaking/intro_myvoice.mp4", start: 0.6, end: 9.3}
      - {file: "branding/health-support-studio/avatar/speaking/sit_myvoice.mp4", start: 4.4, end: 8.9}
      - {file: "branding/health-support-studio/avatar/speaking/office_fixed_myvoice.mp4", start: 0, end: 7.6}
    outro: {file: "branding/health-support-studio/avatar/speaking/outro_v1_myvoice.mp4", start: 0, end: 8.0}
  # You on screen in the middle of the video: about every minute you appear for 5-10 s next to the slide,
  # while your voice keeps narrating. mode "broll": your Flow clips of walking / reading a chart / at the desk
  # (no talking, so no lip-sync needed; folder avatar/broll). mode "lipsync": the talking "moves" clips,
  # lip-synced on Kaggle (lips didn't match well enough). It switches on by itself once broll clips exist.
  host:
    enabled: true
    mode: "mix"      # the host talks (lip-synced) while walking, holding the tablet, reading the chart, at the desk
    talk_every: 2    # 1 = talks every time; 2 = every other time (the others show the 16:9 scenes: report, x-ray, ward)
    broll: "branding/health-support-studio/avatar/broll"
    moves: "branding/health-support-studio/avatar/broll"    # the clips the lips are synced on (face visible)
    moves_only:
      - "Man_walking_in_hospital_corridor_20261007132552.mp4"   # walking toward the camera
      - "Man_holding_tablet_in_hospital_20261007133319.mp4"
      - "Man_reading_patient_chart_20261007132917.mp4"
      - "Man_writing_notes_at_desk_20261007133446.mp4"
    # 16:9 videos: the host talks on these 16:9 desk clips instead (full screen, the slide in front)
    moves_wide_folder: "branding/health-support-studio/avatar/speaking"
    moves_wide:
      - "desk_scrubs_16x9.mp4"
      - "intro_desk_16x9.mp4"
      - "outro_desk2_16x9.mp4"
    landscape_crop: 1.0
    every_seconds: 45
    first_at: 30
    snippet_seconds: [5, 10]
    max_wait_minutes: 150
  # The agent rotates through these styles, one per video, so the channel stays varied.
  # Each style can override "format" (landscape/shorts) and "target_minutes".
  styles:
    - name: "Explainer"
      instructions: "A clear, structured explanation of the topic: what it is, why it matters, what to do."
    - name: "Myth vs Fact"
      instructions: "Bust 3-5 common myths about the topic. For each: state the myth, then the fact and why."
    - name: "Quick Short"
      format: "shorts"
      target_minutes: 0.8
      instructions: "One single, surprising, useful fact or tip about the topic in under 60 seconds. Hook in the first 2 seconds."
    - name: "Warning Signs"
      instructions: "The key symptoms or warning signs to watch for, which ones mean call 911 now vs see a doctor soon."
    - name: "Top Questions"
      instructions: "Answer the 4-6 questions people most often ask about the topic, in a friendly Q&A style."

# ---- Free AI voice (Kokoro, used in voice_slides mode) ----
# American English voices: af_heart, af_bella, af_nicole, af_sarah (female);
# am_michael, am_fenrir, am_puck (male). Try them with: python -m youtube_agent.main --voice-sample
voice:
  # Your own cloned voice (voice/voice_sample.wav.enc, unlocked with the VOICE_KEY secret).
  # If the clone can't run, fallback_voice is used so the video still gets made.
  engine: "clone"
  speed: 1.1                   # 1.0 = natural pace of the clone
  cfg_weight: 0.3              # pace setting: lower = quicker, livelier
  exaggeration: 0.5            # 0.3 calm ... 0.8 very expressive
  fallback_voice: "am_michael"
  voice: "am_michael"          # Kokoro voice when engine is not "clone"

# ---- Your avatar (HeyGen, only used when video.mode is "avatar") ----
# Run `python -m youtube_agent.main --list-avatars` to see your IDs.
# Can also be set with the HEYGEN_AVATAR_ID / HEYGEN_VOICE_ID environment variables.
avatar:
  avatar_type: "avatar"        # "avatar" (video/digital twin) or "talking_photo" (photo avatar)
  avatar_id: ""
  voice_id: ""
  voice_speed: 1.0

# ---- Editing (optional files in youtube_agent/assets/) ----
# ---- Thumbnails ----
thumbnail:
  host_image: "../branding/health-support-studio/avatar/poses"   # you in scrubs (a different pose each day), on the right

editing:
  intro_clip: "assets/intro.mp4"          # played before the avatar video if the file exists
  outro_clip: "assets/outro.mp4"          # played after it if the file exists
  intro_clip_vertical: "assets/intro_vertical.mp4"   # same, for vertical Shorts (9:16)
  outro_clip_vertical: "assets/outro_vertical.mp4"
  background_music: "assets/music.mp3"    # mixed in quietly if the file exists
  music_volume: 0.08

# ---- YouTube ----
youtube:
  # Your channel (Health Support Studio). Uploads stop if you're logged in to a different channel.
  channel_id: "UCyAuaUoxw-U9PDfO0GVV3jw"
  # Videos upload as PRIVATE so you can watch them first, then set them to Public in YouTube Studio
  # (the YouTube Studio phone app works). Set to false only if you want fully automatic publishing.
  # Each video is uploaded early and SCHEDULED: YouTube makes it public by itself at this time.
  # You can watch it any time before then (YouTube Studio app) and set it to Private if needed.
  # 12:00 New York time = 7 PM Saudi time (8 PM Saudi in winter, when the US changes its clocks). Remove to publish manually instead.
  auto_publish_time: "12:00"
  auto_publish_timezone: "America/New_York"
  # Used only if auto_publish_time is removed: true = upload as Private and publish yourself.
  review_before_publish: true
  privacy: "public"            # used only when both options above are off
  playlists: true              # add each video to its topic playlist (+ "Health Shorts" for Shorts)
  upload_short: true           # also upload the daily vertical Short to YouTube Shorts
  short_delay_hours: 6         # the Short goes public 6 hours after the main video (6 PM New York)
  category_id: "27"            # 27 = Education
  made_for_kids: false
  # YouTube requires disclosure of realistic AI-generated people/voices. Leave this true.
  contains_synthetic_media: true
  # Added to the end of every video description.
  description_footer: |-
    DISCLAIMER: This video is for general educational purposes only and is not medical advice.
    Always talk to your doctor, nurse or pharmacist about your own health. If you think you are
    having a medical emergency, call 911 right away.

    This video uses an AI-generated voice. The script is AI-assisted
    and fact-checked against trusted health sources.

    Health Support Studio | Business inquiries: healthsupportstudio@gmail.com
