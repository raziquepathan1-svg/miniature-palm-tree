        Learn more in our full video on the Health Support Studio channel.
story:
  open: >-
    Imagine Mark. He has had a bad cough for two weeks, he feels fine otherwise, and his daughter just had a new baby. By
    the end of this video, you will know why that cough matters, and what Mark should do before he holds the baby.
  twist: >-
    Remember Mark? Here is the twist. Teens and adults can have whooping cough with no whoop, and they often spread it to
    babies without knowing, so boosters and a doctor visit matter.
  end: >-
    So what should Mark do? Call his doctor and ask about testing, stay away from the baby until he is checked, and make
    sure he and the family are up to date on Tdap.
  short_cliff: >-
    Mark has had a cough for two weeks, and his new grandbaby is visiting. Why does that matter?
  reel_answer: >-
    The answer: adults can have whooping cough without the whoop, and they can pass it to babies, who are at the highest risk. Get checked, and keep Tdap up to date.
