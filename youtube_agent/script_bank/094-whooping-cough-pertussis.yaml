        It starts like a cold. Then the coughing gets worse. Whooping cough can be dangerous for babies.
    - layout: "warning"
      heading: "Protect Babies"
      points: ["Tdap in every pregnancy", "Boosters for teens and adults", "Baby turns blue: call 911"]
      footage_query: "pregnant woman doctor visit"
      narration: >-
        Whooping cough can cause long coughing fits, and babies may stop breathing instead of coughing. The best protection
        is the vaccine. Pregnant women should get Tdap during every pregnancy, and everyone around a new baby should be up to
        date. If a baby stops breathing or turns blue, call nine one one.
    - layout: "outro"
