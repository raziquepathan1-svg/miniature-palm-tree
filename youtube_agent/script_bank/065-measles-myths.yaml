      points: ["Know the facts"]
      footage_query: "child rash fever"
      narration: >-
        Measles was eliminated in the US in 2000. Now it is back, and children have died.
    - layout: "bullets"
      heading: "The Facts"
      points: ["9 in 10 exposed get it", "Not a mild illness", "MMR: 97 percent protection"]
      footage_query: "child vaccine doctor"
      narration: >-
        Measles is so contagious that nine in ten unvaccinated people exposed will catch it. It can cause pneumonia, brain
        swelling and death. Two doses of the MMR vaccine give about ninety seven percent protection, and large studies show no
        link to autism.
    - layout: "outro"
      heading: "Full Video"
      points: ["On YouTube"]
      footage_query: "family smiling outdoors"
      narration: >-
        Learn the measles myths in our full video, on the Health Support Studio YouTube channel.
