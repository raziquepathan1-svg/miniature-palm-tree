story:
  open: >-
    Imagine Hector. His hairline is receding, and he has started buying a new biotin supplement and wearing a cap all day to
    hide it. By the end of this video, you will know what helps, and what does not.
  twist: >-
    Remember Hector? Here is the twist. Hats do not cause baldness, biotin only helps if you are truly deficient, and
    treatments with real evidence exist, so a doctor visit is the smart next step.
  end: >-
    So what should Hector do? See a dermatologist, ask about minoxidil or other treatments for his type of hair loss, tell
    the doctor about any biotin he takes, and be careful with products that promise a cure.
  short_cliff: >-
    Hector wears a cap all day to hide his thinning hair. Is the cap making it worse?
  reel_answer: >-
    The answer: no. Hats do not cause hair loss. Pattern baldness comes from genes and hormones, and a dermatologist can suggest treatments that really work.
