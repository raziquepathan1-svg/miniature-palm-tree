    - layout: "title"
      heading: "Migraine Mistake"
      points: ["That makes it worse"]
      footage_query: "pill bottles table"
      narration: >-
        Taking pain pills for headaches too often can actually make them worse.
    - layout: "warning"
      heading: "Rebound Headaches"
      points: ["Pain pills over 2 to 3 days a week", "More frequent headaches", "Ask about prevention"]
      footage_query: "woman holding head pain"
      narration: >-
        Using pain relievers or migraine medicines more than two or three days a week can cause rebound headaches, which
        become more frequent and harder to treat. If you need them that often, ask your doctor about preventive treatment.
        There are more options today than ever.
    - layout: "outro"
      heading: "Full Video"
      points: ["On YouTube"]
      footage_query: "woman smiling outdoors"
      narration: >-
        Learn more about migraine in our full video, on the Health Support Studio YouTube channel.
