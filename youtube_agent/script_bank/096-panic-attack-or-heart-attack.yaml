    - layout: "warning"
      heading: "When Unsure, Call 911"
      points: ["Even doctors need tests", "New chest pain: get checked", "Panic is treatable"]
      footage_query: "person calling phone emergency"
      narration: >-
        The signs can look almost the same, and even doctors need tests to tell. If you have new chest pain or pressure,
        pain that spreads to your arm or jaw, or you are simply not sure, call nine one one. If your heart is checked and
        healthy, panic attacks are treatable with therapy and sometimes medicine.
