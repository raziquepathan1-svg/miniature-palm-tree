story:
  open: >-
    Imagine Leo. At two in the morning his heart is racing and his chest feels tight, and he tells himself it is just a
    panic attack. By the end of this video, you will know if he can be sure, and what Leo should do.
  twist: >-
    Remember Leo? Here is the twist. Panic and heart attacks can feel almost the same, even doctors need tests to tell,
    and when in doubt the answer is to call nine one one.
  end: >-
    So what should Leo do? Call nine one one for new chest pain, get his heart checked, and if it is panic, ask about
    therapy, and call or text nine eight eight if he ever thinks about hurting himself.
  short_cliff: >-
    Leo's heart is racing and his chest hurts at night. Can he tell if it is panic or a heart attack?
  reel_answer: >-
    The answer: not for sure. The signs can feel the same, and even doctors need tests. When unsure, call nine one one.
