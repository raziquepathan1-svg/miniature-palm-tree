style: "Warning Signs"
sources:
  - "NIH NHLBI, Heart Failure: https://www.nhlbi.nih.gov/health/heart-failure"
  - "CDC, About Heart Failure: https://www.cdc.gov/heart-disease/about/heart-failure.html"
