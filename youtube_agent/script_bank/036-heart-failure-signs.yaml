      footage_query: "bathroom scale feet"
      narration: >-
        One of the earliest warning signs of heart failure getting worse is on your bathroom scale.
    - layout: "warning"
      heading: "Sudden Weight Gain"
      points: ["2 to 3 pounds in a day", "5 pounds in a week", "Call your doctor"]
      footage_query: "swollen feet ankles close up"
      narration: >-
        Gaining two to three pounds in a day, or five in a week, usually means fluid is building up, often before breathing
        gets worse. Weigh yourself every morning, before breakfast. Also watch for swollen ankles and shortness of breath when
        lying flat, and call your doctor early.
