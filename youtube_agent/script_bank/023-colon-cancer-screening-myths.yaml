      footage_query: "test kit mailbox home"
      narration: >-
        Colorectal cancer screening now starts at forty five for adults at average risk. And it is not only colonoscopy. There
        are at home stool tests too. Early colorectal cancer often has no symptoms, so screening is for people who feel fine.
