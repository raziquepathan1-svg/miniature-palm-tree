      narration: >-
        Learn more in our full video on the Health Support Studio channel.
story:
  open: >-
    Imagine Greg. He takes insulin for diabetes, and he wants to try a sixteen hour fast he saw online. By the end of this
    video, you will know why that could be dangerous, and what Greg should do first.
  twist: >-
    Remember Greg? Here is the twist. Fasting can cause dangerously low blood sugar in people who take insulin or certain
    diabetes pills, so it should never be started without a plan from the doctor.
  end: >-
    So what should Greg do? Talk to his doctor before changing when he eats, ask how to adjust his medicine, check his blood
    sugar often, and go to the ER for fainting or confusion.
  short_cliff: >-
    Greg takes insulin and wants to try a long fast. Is that safe?
  reel_answer: >-
    The answer: not without a plan from his doctor. Fasting can cause dangerously low blood sugar in people who take insulin or certain diabetes medicines.
