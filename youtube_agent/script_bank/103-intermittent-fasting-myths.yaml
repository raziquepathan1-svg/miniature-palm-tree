      footage_query: "empty plate clock table"
      narration: >-
        Thinking about intermittent fasting? It is not for everyone.
    - layout: "warning"
      heading: "Talk to Your Doctor"
      points: ["Pregnant or breastfeeding", "Children, eating disorders", "Diabetes medicine: ask first"]
      footage_query: "doctor talking to patient office"
      narration: >-
        Studies show that intermittent fasting works about as well as regular dieting, not better. It is not safe for people
        who are pregnant or breastfeeding, for children and teens, for people with a history of eating disorders, or for people
        who take insulin or certain diabetes medicines without a plan from their doctor. Stop if you feel faint.
