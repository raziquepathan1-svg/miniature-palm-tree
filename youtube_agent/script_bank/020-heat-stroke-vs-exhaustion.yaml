      heading: "Heat Stroke or Exhaustion?"
      points: ["One is a 911 emergency"]
      footage_query: "hot sun city street"
      narration: >-
        Someone is sick in the heat. Is it heat exhaustion or heat stroke? Here is the difference.
    - layout: "bullets"
      heading: "Tell the Difference"
      points: ["Exhaustion: heavy sweat, clammy skin", "Stroke: 103°F+, hot red skin", "Stroke: confusion, passing out"]
      footage_query: "man sweating hot sun"
      narration: >-
        Heat exhaustion: heavy sweating and cold, clammy skin. Move to a cool place and sip water. Heat stroke: a temperature of
        one hundred three or higher, hot red skin, confusion or passing out. Call 911, cool them down, and do not give them
        anything to drink.
    - layout: "outro"
      heading: "Full Video on YouTube"
      points: ["Health Support Studio"]
      footage_query: "family park summer shade"
      narration: >-
        Watch our full guide on the Health Support Studio YouTube channel.
