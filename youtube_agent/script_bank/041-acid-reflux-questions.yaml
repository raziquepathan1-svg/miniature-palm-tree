      points: ["It could be GERD"]
      footage_query: "man holding chest heartburn"
      narration: >-
        Heartburn twice a week or more may be GERD, not just something you ate.
    - layout: "bullets"
      heading: "What Helps"
      points: ["Smaller meals", "No food 3 hours before bed", "Raise the head of your bed"]
      footage_query: "woman sleeping bed pillows"
      narration: >-
        Eat smaller meals, avoid eating for three hours before bed, and raise the head of your bed six to eight inches. If you
        need antacids for more than two weeks, see your doctor. And chest pain with shortness of breath or sweating means call
        911.
    - layout: "outro"
      heading: "Full Video"
      points: ["On YouTube"]
      footage_query: "family dinner table"
      narration: >-
        Learn more about acid reflux in our full video, on the Health Support Studio YouTube channel.
