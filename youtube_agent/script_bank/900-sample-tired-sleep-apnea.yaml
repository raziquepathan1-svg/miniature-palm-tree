plan:
  topic: 'Why you wake up tired: sleep apnea'
  title: Sleeping 8 Hours But Still Tired? Sleep Apnea Signs
  description: 'You sleep eight hours and still wake up exhausted. One common, often missed cause is sleep apnea.
    Learn the signs, why it matters for your heart, and the simple test that finds it.


    In this video:

    • The night-time and daytime signs

    • What happens in your throat at night

    • Why it matters for your heart

    • The home sleep test and treatments

    • When to call your doctor and when to go to the ER


    #SleepApnea #Snoring #SleepHealth #HealthEducation'
  tags:
  - sleep apnea
  - tired after sleeping
  - wake up tired
  - snoring
  - sleep apnea symptoms
  - cpap
  - home sleep test
  - sleep health
  - health education
  thumbnail_text: STILL TIRED?
  thumbnail_highlight: TIRED?
  thumbnail_photo_query: man yawning office
  playlist: Healthy Habits & Prevention
  scenes:
  - layout: title
    heading: Tired After Eight Hours?
    points:
    - The hidden night-time cause
    footage_query: man yawning office
    narration: You slept eight hours, so why do you wake up exhausted? Your body may be doing something at night
      that you never notice, and it can be hard on your heart. Imagine Tom, forty eight. He blames work. He is wrong.
      Stay with me.
  - layout: bullets
    heading: What Happens at Night
    points:
    - Throat muscles relax
    - The airway narrows or closes
    - Breathing stops for 10 seconds or more
    - Your brain wakes you briefly
    footage_query: medical illustration throat
    narration: This is sleep apnea. During sleep, the muscles in your throat relax and the airway narrows or closes.
      Breathing stops for ten seconds or more, oxygen drops, and your brain wakes you just enough to gasp and start
      again. It can happen dozens of times a night, and you remember none of it.
  - layout: warning
    heading: Night-Time Signs
    points:
    - Loud snoring
    - Gasping or choking
    - Pauses seen by a partner
    - Dry mouth, morning headache
    footage_query: man snoring bed
    narration: Here are the signs. Loud snoring. Gasping or choking in your sleep. A partner who notices your breathing
      stop. And waking with a dry mouth or a headache. Tom had all four. He just never saw them, because he was
      asleep.
  - layout: warning
    heading: Daytime Signs
    points:
    - Tired all day
    - Falling asleep sitting down
    - Trouble focusing
    - Low mood
    footage_query: man stressed at desk
    narration: By day it looks different. Heavy tiredness, nodding off while sitting, trouble focusing, and a low
      mood. Most people blame stress or age. That is why most people with sleep apnea have never been diagnosed.
  - layout: big_number
    heading: Why It Matters
    points:
    - Heart
    - Untreated sleep apnea raises blood pressure risk
    footage_query: blood pressure monitor arm
    narration: And here is why it matters. Untreated sleep apnea is linked to high blood pressure, irregular heartbeat,
      stroke, and drowsy driving crashes. Each time breathing stops, your heart has to work harder.
  - layout: bullets
    heading: The Test and the Fix
    points:
    - Ask your doctor
    - Home sleep test
    - CPAP keeps the airway open
    - Weight loss and side sleeping help
    footage_query: cpap machine bed
    narration: The good news is that it is easy to check. Tell your doctor about your snoring and tiredness. A home
      sleep test can find it. Then treatment, like a CPAP machine that gently keeps your airway open, can bring
      back energy, often within weeks. Losing extra weight and sleeping on your side can help too.
  - layout: outro
    heading: Call or Go?
    points:
    - 'Doctor: snoring, tired all day'
    - 'ER: chest pain, face drooping, can''t speak'
    footage_query: man smiling morning
    narration: So what should Tom do? Book a visit and ask for a sleep test. That is exactly what he did, and within
      a month he was waking up rested. Call your doctor if you snore loudly or feel tired all day. Go to the ER
      for chest pain, face drooping, or trouble speaking. Subscribe, and watch next how sleep affects your blood
      sugar.
  short_scenes:
  - layout: title
    heading: Still Tired?
    points:
    - Eight hours of sleep
    footage_query: man yawning office
    narration: You slept eight hours and still wake up exhausted. Loud snoring and gasping at night can be signs
      of sleep apnea, a common condition where breathing stops and starts again and again during sleep. Most people
      who have it do not know. It is linked to high blood pressure and drowsy driving, and a simple home sleep test
      can find it.
  - layout: outro
    heading: Full Video
    points:
    - On YouTube
    footage_query: man smiling morning
    narration: Learn more in our full video on the Health Support Studio channel.
  short_title: 'Slept 8 Hours, Still Tired? #Shorts'
  short_caption: Waking up exhausted? It may be sleep apnea. Full video on the channel.
story:
  open: 'Tom has a secret: for years his sleep has been broken, and he has no idea. By the end you will know what
    to ask his doctor.'
  short_cliff: Tom slept eight hours and still felt exhausted. What was happening at night?
  reel_answer: 'The answer: sleep apnea, a common problem where breathing stops again and again during sleep. A
    home sleep test can find it.'
