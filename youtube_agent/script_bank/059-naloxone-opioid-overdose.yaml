      points: ["Naloxone saves lives"]
      footage_query: "naloxone nasal spray"
      narration: >-
        Someone will not wake up, and their breathing is slow or stopped. It could be an opioid overdose.
    - layout: "bullets"
      heading: "What to Do"
      points: ["Call 911", "Spray naloxone in one nostril", "Support breathing, stay with them"]
      footage_query: "person calling phone emergency"
      narration: >-
        Call 911. Give naloxone nasal spray in one nostril. If they are not breathing, give rescue breaths or CPR. Give a
        second dose after two to three minutes if needed, and stay with them. Naloxone is safe and sold without a
        prescription.
