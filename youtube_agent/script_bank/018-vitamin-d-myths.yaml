    - layout: "title"
      heading: "Vitamin D Through Glass?"
      points: ["Myth vs fact"]
      footage_query: "person sitting by window"
      narration: >-
        Sitting in the sun by a window all day? You might think you are getting vitamin D.
    - layout: "myth_fact"
      heading: "Myth vs Fact"
      points: ["Sun through a window counts", "Glass blocks the rays you need"]
      footage_query: "sunlight window morning"
      narration: >-
        Your skin needs UVB rays to make vitamin D, and window glass blocks them. You can also get vitamin D from fatty fish and
        fortified milk. And more is not always better, because too much from supplements can be harmful.
    - layout: "outro"
      heading: "4 More Vitamin D Myths"
      points: ["Full video on YouTube"]
      footage_query: "family outdoor walk"
      narration: >-
        We bust four more myths in our full video, on the Health Support Studio YouTube channel.
