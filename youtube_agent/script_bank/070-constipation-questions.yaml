      footage_query: "woman holding stomach"
      narration: >-
        Constipated? Before reaching for a detox tea, try these simple steps.
    - layout: "bullets"
      heading: "What Helps"
      points: ["Add fiber slowly", "Water and walking", "Feet up on a stool"]
      footage_query: "bathroom stool footrest"
      narration: >-
        Add fiber slowly, from beans, whole grains, fruits like pears and kiwi, and prunes. Drink water and walk most days. On
        the toilet, put your feet up on a small stool. And see a doctor for blood in your stool or a new change in your
        habits.
