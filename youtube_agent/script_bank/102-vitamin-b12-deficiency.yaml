    - layout: "warning"
      heading: "Who Is at Risk"
      points: ["Over 50, vegans", "Metformin or acid reducers", "A blood test can tell"]
      footage_query: "lab technician drawing blood"
      narration: >-
        Adults over fifty, vegans, and people who take metformin or acid reducers are more likely to run low. Low B12 can
        damage nerves if it goes untreated, so ask your doctor for a blood test. B12 shots only help if you are actually low.
        Go to the emergency room for sudden weakness on one side or trouble speaking.
    - layout: "outro"
