        Learn more in our full video on the Health Support Studio channel.
story:
  open: >-
    Imagine Walter. He is sixty eight, he takes metformin for diabetes, and his feet tingle and he feels tired all the time.
    By the end of this video, you will know what might be going on, and what Walter should ask his doctor.
  twist: >-
    Remember Walter? Here is the twist. Metformin and age can both lower B12 absorption, and nerve damage from low B12 can
    become permanent if it is not treated.
  end: >-
    So what should Walter do? Ask his doctor for a B12 blood test, tell the doctor about his medicines, follow the treatment
    plan, and go to the ER for sudden weakness on one side or trouble speaking.
  short_cliff: >-
    Walter takes metformin, and his feet tingle. Why does that matter?
  reel_answer: >-
    The answer: metformin and aging can lower B12 absorption, and low B12 can cause tingling and nerve damage. Ask your doctor for a simple blood test.
