      heading: "Severe Allergic Reaction?"
      points: ["What to do first"]
      footage_query: "peanuts bowl close up"
      narration: >-
        Someone's lips are swelling and they are struggling to breathe after eating. Here is what to do.
    - layout: "warning"
      heading: "Act Fast"
      points: ["Epinephrine if prescribed", "Call 911", "Go to the ER even if better"]
      footage_query: "person calling phone emergency"
      narration: >-
        This could be anaphylaxis. If they have a prescribed epinephrine auto injector, use it right away. Then call 911. An
        allergy pill like Benadryl does not stop a severe reaction. And even if they feel better, they still need the ER,
        because symptoms can come back.
    - layout: "outro"
      heading: "Know the Signs"
      points: ["Full video on YouTube"]
      footage_query: "family picnic park"
      narration: >-
        Learn all the warning signs in our full video, on the Health Support Studio YouTube channel.
