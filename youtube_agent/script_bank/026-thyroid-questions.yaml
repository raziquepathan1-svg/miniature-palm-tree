      points: ["In many hair and nail supplements", "Can cause false results", "Tell your doctor"]
      footage_query: "woman reading supplement label"
      narration: >-
        Biotin, found in many hair, skin and nail supplements, can interfere with some lab tests, including thyroid tests, and
        give false results. The FDA has warned about this. Tell your doctor about every supplement you take before any blood
