    - layout: "bullets"
      heading: "Know This"
      points: ["Enlarged prostate is common", "It is not cancer", "Very treatable"]
      footage_query: "middle aged man doctor consultation"
      narration: >-
        About half of men in their fifties have an enlarged prostate. It is not cancer, and it is very treatable. Early
        prostate cancer usually has no symptoms, so talk with your doctor about whether a PSA test is right for you.
