  short_scenes:
    - layout: "title"
      heading: "Low Blood Sugar?"
      points: ["Use the rule of 15"]
      footage_query: "man sweating dizzy"
      narration: >-
        Shaky, sweaty and confused? If you have diabetes, it could be low blood sugar. Here is what to do.
    - layout: "bullets"
      heading: "Rule of 15"
      points: ["15 grams of fast sugar", "Wait 15 minutes", "Check, repeat if under 70"]
      footage_query: "orange juice glass"
      narration: >-
        Have fifteen grams of fast sugar, like four glucose tablets or half a cup of juice. Wait fifteen minutes and check
        again. If you are still below seventy, repeat. Skip the chocolate, since fat slows it down. If someone passes out, use
        glucagon and call 911.
    - layout: "outro"
      heading: "Full Video"
      points: ["On YouTube"]
      footage_query: "family walking outdoors"
      narration: >-
        Learn all the warning signs in our full video, on the Health Support Studio YouTube channel.
