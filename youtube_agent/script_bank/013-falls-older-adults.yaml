  short_scenes:
    - layout: "title"
      heading: "Prevent a Fall at Home"
      points: ["4 quick fixes"]
      footage_query: "senior woman walking home"
      narration: >-
        One in four adults sixty five and older falls every year. Here are four quick fixes at home.
    - layout: "bullets"
      heading: "Quick Fixes"
      points: ["Remove loose rugs", "Grab bars in bathroom", "Night lights", "Sturdy non-slip shoes"]
      footage_query: "bathroom grab bar"
      narration: >-
        Remove loose rugs and clutter from walkways. Put grab bars in the bathroom. Add night lights between the bedroom and
        bathroom. And wear sturdy, non slip shoes, even at home. Staying active with strength and balance exercise helps too.
    - layout: "outro"
      heading: "5 Fall Myths on YouTube"
      points: ["Health Support Studio"]
      footage_query: "senior couple walking park"
      narration: >-
        We bust five fall myths in our full video, on the Health Support Studio YouTube channel.
