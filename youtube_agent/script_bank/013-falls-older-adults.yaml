queue_topic: "How to prevent a fall at home for older adults"
style: "Myth vs Fact"
sources:
  - "CDC, Facts About Older Adult Falls: https://www.cdc.gov/falls/data-research/facts-stats/index.html"
  - "CDC, About Older Adult Fall Prevention: https://www.cdc.gov/falls/about/index.html"
