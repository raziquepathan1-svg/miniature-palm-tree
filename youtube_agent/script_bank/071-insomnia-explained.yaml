      heading: "Cannot Sleep?"
      points: ["Try this instead of pills"]
      footage_query: "woman lying awake bed"
      narration: >-
        Lying awake for hours? The best treatment for chronic insomnia is not a sleeping pill.
    - layout: "bullets"
      heading: "What Works"
      points: ["Same wake time every day", "Get up after 20 minutes awake", "Ask about CBT-I"]
      footage_query: "alarm clock morning"
      narration: >-
        Get up at the same time every day, even on weekends. If you cannot sleep after about twenty minutes, get out of bed
        and do something calm until you feel sleepy. And ask your doctor about cognitive behavioral therapy for insomnia, the
        recommended first treatment.
