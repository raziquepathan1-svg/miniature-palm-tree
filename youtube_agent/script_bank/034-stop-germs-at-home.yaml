  short_scenes:
    - layout: "title"
      heading: "Washing Your Hands Wrong?"
      points: ["Most people do"]
      footage_query: "washing hands sink"
      narration: >-
        Most people wash their hands for only a few seconds. Here is how to do it right.
    - layout: "bullets"
      heading: "The Right Way"
      points: ["Wet and lather", "Scrub 20 seconds", "Rinse and dry well"]
      footage_query: "scrubbing hands close up"
      narration: >-
        Wet your hands and lather with soap, including the backs, between your fingers and under your nails. Scrub for at
        least twenty seconds, about two rounds of Happy Birthday. Rinse and dry with a clean towel. Sanitizer works when there
        is no soap, but not for stomach bugs.
    - layout: "outro"
      heading: "Full Video"
      points: ["On YouTube"]
      footage_query: "family kitchen smiling"
      narration: >-
        Learn more ways to stop germs at home in our full video, on the Health Support Studio YouTube channel.
