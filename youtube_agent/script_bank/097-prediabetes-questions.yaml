      points: ["Often no symptoms", "A1C or fasting blood sugar", "Small weight loss helps a lot"]
      footage_query: "lab technician drawing blood"
      narration: >-
        Prediabetes usually has no symptoms, so only a blood test can tell. If you are overweight, over thirty five, or have
        a parent with diabetes, ask your doctor. The good news is that losing five to seven percent of your weight and moving
        more can cut your risk of type 2 diabetes by more than half.
