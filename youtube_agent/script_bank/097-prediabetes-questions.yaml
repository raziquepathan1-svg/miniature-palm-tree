        Learn more in our full video on the Health Support Studio channel.
story:
  open: >-
    Imagine Rosa. She feels fine, but her father has diabetes and her doctor said her blood sugar is a little high. By
    the end of this video, you will know what that means, and whether Rosa can do anything about it.
  twist: >-
    Remember Rosa? Here is the twist. Prediabetes often has no symptoms, and it is not too late, because losing five to
    seven percent of her weight and moving more can cut her risk by more than half.
  end: >-
    So what should Rosa do? Get her blood sugar rechecked, walk about thirty minutes most days, eat more vegetables and
    whole grains, join a diabetes prevention program, and call her doctor if she gets very thirsty or her vision blurs.
  short_cliff: >-
    Rosa feels fine, but her blood sugar is a little high. Is it too late to do anything?
  reel_answer: >-
    The answer: no. Losing five to seven percent of your weight and moving more can cut the risk of type 2 diabetes by more than half.
