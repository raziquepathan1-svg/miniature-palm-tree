  short_scenes:
    - layout: "title"
      heading: "Someone Is Choking"
      points: ["Do this now"]
      footage_query: "man choking restaurant"
      narration: >-
        Someone grabs their throat and cannot talk or cough. Here is what to do.
    - layout: "bullets"
      heading: "Act Fast"
      points: ["Call 911", "5 back blows", "5 abdominal thrusts, repeat"]
      footage_query: "first aid training heimlich"
      narration: >-
        Have someone call 911. Lean the person forward and give five firm back blows between the shoulder blades. Then give
        five quick abdominal thrusts, with your fist just above their belly button, pushing in and up. Repeat until it comes
        out. For babies, never use abdominal thrusts.
    - layout: "outro"
      heading: "Full Video"
      points: ["On YouTube"]
      footage_query: "family dinner table"
      narration: >-
        Learn choking first aid for babies and kids in our full video, on the Health Support Studio YouTube channel.
