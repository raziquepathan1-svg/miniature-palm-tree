      footage_query: "man snoring bed"
      narration: >-
        Loud snoring, gasping at night, and feeling tired all day can be signs of sleep apnea.
    - layout: "warning"
      heading: "Why It Matters"
      points: ["Breathing stops at night", "Linked to heart problems", "Most people are undiagnosed"]
      footage_query: "blood pressure monitor arm"
      narration: >-
        In sleep apnea, breathing stops and starts many times a night. It is linked to high blood pressure, irregular
        heartbeat, stroke and car crashes, and most people with it do not know. A home sleep test can find it, and treatments
        like CPAP work.
