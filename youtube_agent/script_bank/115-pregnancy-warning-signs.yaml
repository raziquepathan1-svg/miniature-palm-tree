      heading: "Pregnant? Know the Signs"
      points: ["Do not ignore these"]
      footage_query: "pregnant woman holding belly worried"
      narration: >-
        Most pregnancies go well. But some symptoms should never be ignored.
    - layout: "warning"
      heading: "Call Right Away"
      points: ["Severe headache, vision changes", "Bleeding or fluid leaking", "Baby moving less", "Trouble breathing or chest pain: 911"]
      footage_query: "pregnant woman calling phone doctor"
      narration: >-
        Call your doctor right away for a headache that will not go away, vision changes, sudden swelling of the face or hands, any
        vaginal bleeding, fluid leaking, a fever, severe belly pain, or if your baby moves less than usual. Call nine one one for chest
        pain or trouble breathing. These signs matter during pregnancy and for a year after birth.
    - layout: "outro"
      heading: "Full Video"
      points: ["On YouTube"]
      footage_query: "family at home together"
      narration: >-
        Learn more in our full video on the Health Support Studio channel.
story:
  open: >-
    Imagine Tanya. She is thirty four weeks pregnant, and she has a headache that will not go away, her vision looks blurry, and
    her hands are swollen, but she does not want to bother her doctor. By the end of this video, you will know what she should do.
  twist: >-
    Remember Tanya? Here is the twist. A headache that will not go away, vision changes, and sudden swelling can be signs of
    preeclampsia, so the answer is to call right away and never wait.
  end: >-
    So what should Tanya do? Call her doctor or go to the hospital right away, tell them about her headache, vision changes, and
    swelling, and call nine one one for chest pain, trouble breathing, or heavy bleeding.
  short_cliff: >-
    Tanya has a headache that will not go away, blurry vision, and swollen hands near the end of her pregnancy. Can she wait?
  reel_answer: >-
    The answer: no. These can be signs of preeclampsia. Call your doctor or go to the hospital right away.
