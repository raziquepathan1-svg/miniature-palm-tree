plan:
  title: 'Ebola in 2026: How It Spreads and Who Is at Risk'
  description: 'Ebola is in the news again. Here is how Ebola really spreads, the early symptoms, who is at risk,
    what travelers should do, and why the risk for most people is very low, based on the CDC and WHO.


    In this video:

    • The 2026 outbreak in brief

    • How Ebola spreads (and how it does not)

    • Symptoms and warning signs

    • Travel advice


    #Ebola #Outbreak #PublicHealth #HealthNews #HealthEducation'
