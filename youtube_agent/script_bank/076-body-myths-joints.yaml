  - layout: bullets
    heading: What Studies Show
    points:
    - No link to arthritis
    - The pop is a gas bubble
    - 'Pain or swelling: get checked'
    footage_query: joint x ray hand
    narration: Studies have not found more arthritis in people who crack their knuckles. The pop is just a gas bubble
      forming in the fluid inside the joint. One doctor cracked the knuckles of only one hand for about sixty years
      and found no difference. But if a joint hurts when it pops, or it is swollen, see a doctor.
