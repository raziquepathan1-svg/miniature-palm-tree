      points: ["Here's why"]
      footage_query: "sick person blanket couch"
      narration: >-
        Got a cold and want antibiotics? Here is why they will not help you.
    - layout: "bullets"
      heading: "Wrong Kind of Germ"
      points: ["Antibiotics kill bacteria", "Colds and flu are viruses", "Side effects are real", "Overuse breeds resistance"]
      footage_query: "microscope bacteria cells"
      narration: >-
        Antibiotics kill bacteria. Colds and the flu are caused by viruses, so antibiotics cannot touch them. Taking them
        anyway can cause side effects like diarrhea and allergic reactions, and it helps bacteria become resistant.
        Rest, fluids and time are what help most. And if you do get an antibiotic, take it exactly as prescribed.
