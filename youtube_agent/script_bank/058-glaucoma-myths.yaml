    - layout: "bullets"
      heading: "Know This"
      points: ["Often no symptoms", "Half do not know they have it", "Dilated eye exam finds it"]
      footage_query: "eye doctor exam"
      narration: >-
        Glaucoma slowly steals side vision with no pain and no early symptoms, and the loss is permanent. About half of people
        with it do not know. A dilated eye exam can catch it early. People over sixty, Black adults over forty, and those with
        a family history should be checked regularly.
