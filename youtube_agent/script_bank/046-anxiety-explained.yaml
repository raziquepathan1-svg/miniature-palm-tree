    - layout: "bullets"
      heading: "Calm Breathing"
      points: ["In for 4 counts", "Out for 6 counts", "Repeat a few minutes"]
      footage_query: "woman breathing exercise"
      narration: >-
        Breathe in gently through your nose for a count of four. Then breathe out slowly through your mouth for a count of
        six. Breathing out longer than you breathe in helps slow your heart rate. If worry takes over most days, talk to your
        doctor. Anxiety is very treatable.
