    - layout: "bullets"
      heading: "Recovery Facts"
      points: ["Fastest in first 3 months", "Gains continue for years", "1 in 4 strokes are repeats"]
      footage_query: "physical therapist patient"
      narration: >-
        The fastest recovery usually happens in the first three months, but many people keep improving for years with
        practice. About one in four strokes are repeat strokes, so controlling blood pressure and taking prevention medicines
        is key. And know the BE FAST signs.
