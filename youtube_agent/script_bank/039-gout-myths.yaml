queue_topic: "Gout: myths vs facts"
style: "Myth vs Fact"
sources:
  - "CDC, Gout: https://www.cdc.gov/arthritis/gout/index.html"
  - "NIH NIAMS, Gout: https://www.niams.nih.gov/health-topics/gout"
