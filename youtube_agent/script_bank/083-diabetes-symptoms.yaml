      points: ["Peeing a lot, often at night", "Very thirsty or hungry", "Blurry vision, very tired"]
      footage_query: "man rubbing eyes tired"
      narration: >-
        Peeing a lot, being very thirsty or hungry, blurry vision, feeling very tired, and sores that heal slowly can all be
