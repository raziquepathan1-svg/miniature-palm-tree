story:  # owner Nov 9: movie-style suspense (a clearly hypothetical case, resolved only with facts from this video)
  open: >-
    Picture Maria, forty five. For months she has been thirsty all day, up twice a night to pee, and tired no matter
    how much she sleeps. She blames stress and the heat. By the end of this video, you will know what those three
    signs were telling her, and the one simple test that would have given her the answer.
  twist: >-
    Remember Maria? Here is why she never suspected it. Type two diabetes often grows slowly for years, so the signs
    creep in so gradually that people get used to them.
  end: >-
    So what should Maria do? Ask her doctor for an A1C blood test. If it shows prediabetes, small changes like losing a
    little weight, walking about thirty minutes a day, and swapping sugary drinks for water can bring her blood sugar
    back toward normal. And if it shows diabetes, the sooner it is treated, the better.
  short_cliff: >-
    But there is one diabetes sign that means go to the emergency room, not wait for an appointment. Do you know it?
  reel_answer: >-
    Here is the answer: breath that smells fruity, especially with vomiting or fast, deep breathing. It can mean
    diabetic ketoacidosis. Go to the ER or call 911.
