  short_scenes:
    - layout: "title"
      heading: "Is Your Child Dehydrated?"
      points: ["Signs parents miss"]
      footage_query: "child drinking water"
      narration: >-
        A stomach bug or a fever can dehydrate a child faster than you think. Here are signs to watch.
    - layout: "bullets"
      heading: "Watch For"
      points: ["Fewer wet diapers", "No tears when crying", "Sunken eyes", "Very sleepy or floppy"]
      footage_query: "baby sleeping crib"
      narration: >-
        Fewer wet diapers than usual. Crying without tears. A dry mouth and sunken eyes. And a child who is unusually sleepy or
        floppy. That last one, or a child who is hard to wake, means get emergency help right away.
    - layout: "outro"
      heading: "Signs in Older Adults Too"
      points: ["Full video on YouTube"]
      footage_query: "senior man sitting home"
      narration: >-
        Older adults show different signs, like sudden confusion. Watch our full video on the Health Support Studio YouTube
        channel.
