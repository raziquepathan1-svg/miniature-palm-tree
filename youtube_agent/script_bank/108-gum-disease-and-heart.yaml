story:
  open: >-
    Imagine Samir. His gums bleed every time he brushes, so he has started brushing less around those spots, and he has not
    seen a dentist in years. By the end of this video, you will know why that is the wrong move.
  twist: >-
    Remember Samir? Here is the twist. Bleeding gums are a sign of inflammation, brushing and flossing gently is what helps,
    and gum disease is linked to heart disease and diabetes.
  end: >-
    So what should Samir do? Keep brushing gently twice a day, floss, see a dentist, and go to the ER for swelling that
    spreads to the face or neck, or trouble breathing.
  short_cliff: >-
    Samir's gums bleed when he brushes, so he brushes less. Is that smart?
  reel_answer: >-
    The answer: no. Bleeding is a sign of inflammation. Keep brushing and flossing gently, and see a dentist.
