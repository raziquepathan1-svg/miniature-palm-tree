plan:
  topic: "Shingles and the shingles vaccine"
  title: "Had Chickenpox? You Could Get Shingles"
  description: |-
    About 1 in 3 people in the US will get shingles in their lifetime. If you've had chickenpox, the virus is still in your body. Here is who the CDC recommends get the shingles vaccine.

    #Shingles #ShinglesVaccine #Vaccines #HealthyAging #Shorts
  tags: ["shingles", "shingles vaccine", "shingrix", "chickenpox", "shingles symptoms", "vaccines for adults", "healthy aging", "health shorts"]
  thumbnail_text: "HAD CHICKENPOX?"
  thumbnail_highlight: "CHICKENPOX?"
  thumbnail_photo_query: "adult vaccine arm pharmacy"
  playlist: "Infections & Vaccines"
  scenes:
    - layout: "title"
      heading: "Had Chickenpox as a Kid?"
      points: ["Then read this"]
      footage_query: "pharmacy vaccine arm"
      narration: >-
        Had chickenpox as a kid? The virus never fully leaves your body, and it can wake up years later as shingles.
    - layout: "big_number"
      heading: "1 in 3"
      points: ["people in the US", "will get shingles"]
      footage_query: "senior woman thinking"
      narration: >-
        About one in three people in the US will get shingles. It causes a painful, blistering rash, and for some people the
        nerve pain lasts for months, even after the rash heals.
    - layout: "bullets"
      heading: "CDC Recommends"
      points: ["Adults 50 and older", "Adults 19+ with weak immune systems", "2 doses"]
      footage_query: "doctor talking senior patient"
      narration: >-
        The CDC recommends two doses of the shingles vaccine for adults fifty and older, and for adults nineteen and older with
        weakened immune systems. Even if you already had shingles, ask about it.
