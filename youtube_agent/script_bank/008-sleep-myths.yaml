      heading: "Does a Nightcap Help?"
      points: ["The truth about alcohol and sleep"]
      footage_query: "glass of wine evening"
      narration: >-
        Think a drink before bed helps you sleep? Here is what it really does.
    - layout: "myth_fact"
      heading: "Myth vs Fact"
      points: ["A drink helps me sleep", "Alcohol disrupts sleep later"]
      footage_query: "man awake bed night"
      narration: >-
        Alcohol may make you drowsy at first, but it disrupts your sleep later in the night. You wake up more and feel less
        rested. It can also make snoring and sleep apnea worse. A steady bedtime and a dark, cool room help much more.
    - layout: "outro"
      heading: "4 More Sleep Myths"
      points: ["Full video on YouTube"]
      footage_query: "sunrise bedroom window"
      narration: >-
