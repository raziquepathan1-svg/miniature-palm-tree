queue_topic: "Urinary tract infections (UTIs): symptoms and when to see a doctor"
style: "Top Questions"
sources:
  - "CDC, Urinary Tract Infection Basics: https://www.cdc.gov/uti/about/index.html"
  - "MedlinePlus, Urinary Tract Infections: https://medlineplus.gov/urinarytractinfections.html"
