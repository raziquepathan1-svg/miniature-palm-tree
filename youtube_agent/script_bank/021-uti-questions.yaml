  topic: "Urinary tract infections (UTIs): symptoms and when to see a doctor"
  title: "UTI Symptoms: When to See a Doctor (and Myths to Skip)"
  description: |-
    Burning when you pee? Needing to go all the time? Urinary tract infections are one of the most common infections in the US. We answer the top questions: symptoms, how older adults can look different, whether cranberry works, and when a UTI becomes serious.

    In this video:
    • Common UTI symptoms
    • Signs the infection may have reached the kidneys
    • Why older adults may just seem confused
    • Prevention tips

    #UTI #UrinaryTractInfection #WomensHealth #HealthTips #HealthEducation
