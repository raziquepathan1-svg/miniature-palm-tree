  short_scenes:
    - layout: "title"
      heading: "Cranberry for a UTI?"
      points: ["Myth vs fact"]
      footage_query: "cranberry juice glass"
      narration: >-
        Got a UTI and reaching for cranberry juice? Here is the truth.
    - layout: "myth_fact"
      heading: "Myth vs Fact"
      points: ["Cranberry juice cures a UTI", "It doesn't treat an infection"]
      footage_query: "woman discomfort couch"
      narration: >-
        Cranberry does not treat an active infection. A bacterial UTI usually needs antibiotics from a clinician. And if you
        have fever, chills, back or side pain, or vomiting, the infection may have reached your kidneys, so see a doctor the
        same day.
    - layout: "outro"
      heading: "Full Video on YouTube"
      points: ["Health Support Studio"]
      footage_query: "patient talking doctor office"
      narration: >-
        Learn how UTIs look different in older adults, in our full video on the Health Support Studio YouTube channel.
