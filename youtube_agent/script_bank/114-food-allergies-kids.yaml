        Learn more in our full video on the Health Support Studio channel.
story:
  open: >-
    Imagine Carmen. Her toddler ate a cookie with nuts, and now has hives and a hoarse voice, and Carmen wonders if she should wait
    and see. By the end of this video, you will know the first thing to do, and why waiting is a mistake.
  twist: >-
    Remember Carmen? Here is the twist. Antihistamines do not treat anaphylaxis, and delaying epinephrine is linked to worse
    outcomes, so the first move is epinephrine and then nine one one.
  end: >-
    So what should Carmen do? Give epinephrine right away, call nine one one, lay her child flat, and go to the ER even if
    the child looks better. Later, she should see an allergist and make an action plan.
  short_cliff: >-
    Carmen's toddler has hives and a hoarse voice after a cookie. Should she wait and see?
  reel_answer: >-
    The answer: no. Give epinephrine right away, then call nine one one. Do not wait, and do not rely on antihistamines.
