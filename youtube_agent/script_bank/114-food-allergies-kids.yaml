        Your child ate something, and now there are hives, swelling, and trouble breathing. What do you do first?
    - layout: "warning"
      heading: "Epinephrine First"
      points: ["Give epinephrine right away", "Then call 911", "Go to the ER even if better"]
      footage_query: "person calling phone emergency"
      narration: >-
        In a severe reaction, give epinephrine right away, in the outer thigh, and then call nine one one. Lay the child flat. Do not
