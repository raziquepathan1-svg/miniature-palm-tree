  short_scenes:
    - layout: "title"
      heading: "Asthma Attack?"
      points: ["Know when to call 911"]
      footage_query: "person using inhaler"
      narration: >-
        An asthma attack can go from mild to life threatening. Know these danger signs.
    - layout: "warning"
      heading: "Call 911 If"
      points: ["Can't talk or walk", "Blue or gray lips or nails", "Inhaler isn't helping", "Skin sucking in at ribs"]
      footage_query: "ambulance emergency lights"
      narration: >-
        Call 911 if the person cannot talk or walk because they are out of breath, their lips or nails look blue or gray, their
        rescue inhaler is not helping, or the skin between their ribs sucks in with each breath. Sit them upright and keep them
        calm while you wait.
    - layout: "outro"
      heading: "Full Video on YouTube"
      points: ["Health Support Studio"]
      footage_query: "family park playing"
      narration: >-
        Learn the early warning signs in our full video, on the Health Support Studio YouTube channel.
