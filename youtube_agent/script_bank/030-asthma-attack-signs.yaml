queue_topic: "Asthma attack warning signs and what to do"
style: "Warning Signs"
sources:
  - "CDC, About Asthma: https://www.cdc.gov/asthma/about/index.html"
  - "NIH NHLBI, Asthma: https://www.nhlbi.nih.gov/health/asthma"
