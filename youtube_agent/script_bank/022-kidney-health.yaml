    - layout: "bullets"
      heading: "Two Simple Tests"
      points: ["Blood test: eGFR", "Urine test: albumin", "Diabetes or high BP? Ask"]
      footage_query: "urine sample laboratory"
      narration: >-
        Kidney disease usually has no symptoms until it is advanced. Two simple tests can catch it early: a blood test called
        eGFR, and a urine test for albumin. If you have diabetes or high blood pressure, the two biggest causes, ask your
        doctor about both.
