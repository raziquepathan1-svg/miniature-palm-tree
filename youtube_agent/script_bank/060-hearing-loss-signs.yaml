        Turning up the TV, asking people to repeat, and thinking everyone mumbles can be signs of hearing loss.
    - layout: "bullets"
      heading: "Do Not Wait"
      points: ["Linked to dementia risk", "Get a hearing test", "OTC hearing aids since 2022"]
      footage_query: "hearing aid close up"
      narration: >-
        Untreated hearing loss is linked to loneliness, falls, and a higher risk of dementia. Get your hearing tested. Since
        2022, adults with mild to moderate hearing loss can buy hearing aids over the counter. And sudden hearing loss in one
        ear needs a doctor within days.
