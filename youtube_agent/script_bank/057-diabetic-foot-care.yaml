      heading: "Diabetes and Your Feet"
      points: ["A 2-minute habit"]
      footage_query: "person checking feet"
      narration: >-
        Diabetes is the leading cause of leg and foot amputations in the US. A two minute daily habit can help prevent them.
    - layout: "bullets"
      heading: "Every Day"
      points: ["Check tops, bottoms, between toes", "Never go barefoot", "Call about any sore"]
      footage_query: "foot close up"
      narration: >-
        Check your feet every day, including between your toes, using a mirror if needed. Look for cuts, blisters, redness or
        swelling. Never go barefoot, even at home. And call your doctor the same day about any sore that is not healing.
