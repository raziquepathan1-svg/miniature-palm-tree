    - layout: "myth_fact"
      heading: "Myth vs Fact"
      points: ["Washing chicken makes it safer", "It splashes germs around"]
      footage_query: "kitchen sink water splash"
      narration: >-
        Washing raw chicken does not remove the germs that matter. It splashes them onto your sink, counters and nearby food.
        Cooking is what kills them. Cook chicken to one hundred sixty five degrees Fahrenheit, checked with a food thermometer.
