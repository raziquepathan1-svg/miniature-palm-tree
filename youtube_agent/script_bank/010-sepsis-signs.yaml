queue_topic: "Sepsis: the emergency most people have never heard of"
style: "Warning Signs"
sources:
  - "CDC, About Sepsis: https://www.cdc.gov/sepsis/about/index.html"
  - "CDC, Sepsis Burden: https://www.cdc.gov/sepsis/communication-resources/burden.html"
