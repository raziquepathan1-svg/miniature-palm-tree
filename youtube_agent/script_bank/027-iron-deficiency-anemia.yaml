queue_topic: "Iron deficiency anemia: signs, causes and what helps"
style: "Explainer"
sources:
  - "NIH NHLBI, Iron-Deficiency Anemia: https://www.nhlbi.nih.gov/health/anemia/iron-deficiency-anemia"
  - "NIH Office of Dietary Supplements, Iron Fact Sheet for Consumers: https://ods.od.nih.gov/factsheets/Iron-Consumer/"
