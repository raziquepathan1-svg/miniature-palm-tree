      points: ["Craving ice", "Always tired", "Pale skin", "Short of breath"]
      footage_query: "tired woman desk"
      narration: >-
        Craving ice can be a sign of iron deficiency anemia, along with tiredness, pale skin, and shortness of breath. Do not
        just start iron pills on your own. Ask your doctor for a blood test, and to find the cause, because it can be hidden
        bleeding.
