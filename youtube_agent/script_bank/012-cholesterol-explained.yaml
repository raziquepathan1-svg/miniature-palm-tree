      heading: "LDL or HDL?"
      points: ["Which one is good?"]
      footage_query: "blood test tube"
      narration: >-
        LDL, HDL. Which cholesterol is the good one? Here is an easy way to remember.
    - layout: "bullets"
      heading: "Easy Memory Trick"
      points: ["LDL: L for lousy, keep it low", "HDL: H for healthy, higher is better", "No symptoms, get tested"]
      footage_query: "doctor explaining heart model"
      narration: >-
        LDL, think L for lousy. It builds up as plaque in your arteries, so lower is better. HDL, think H for healthy. It helps
        clear cholesterol away, so higher is better. High cholesterol has no symptoms, so ask your doctor about a blood test.
