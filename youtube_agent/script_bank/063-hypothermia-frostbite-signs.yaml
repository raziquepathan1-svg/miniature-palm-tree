queue_topic: "Hypothermia and frostbite: warning signs and first aid"
style: "Warning Signs"
sources:
  - "CDC, Preventing Hypothermia: https://www.cdc.gov/winter-weather/prevention/index.html"
  - "CDC, Frostbite: https://www.cdc.gov/winter-weather/about/index.html"
