      heading: "A Vaccine Against Cancer"
      points: ["The HPV vaccine"]
      footage_query: "teenager vaccine doctor"
      narration: >-
        There is a vaccine that can prevent several kinds of cancer. It is the HPV vaccine.
    - layout: "bullets"
      heading: "Know This"
      points: ["Prevents 6 types of cancer", "For boys and girls at 11 or 12", "Safe since 2006"]
      footage_query: "doctor child vaccine"
      narration: >-
        HPV causes cancers of the cervix, throat and other areas, in men and women. The vaccine is recommended for all kids at
        eleven or twelve, and works best before any exposure. Over one hundred thirty five million doses have been given in
        the US, and it has already cut HPV infections dramatically.
    - layout: "outro"
      heading: "Full Video"
      points: ["On YouTube"]
      footage_query: "family smiling outdoors"
      narration: >-
        Learn the HPV vaccine myths in our full video, on the Health Support Studio YouTube channel.
