    footage_query: cloudy sky beach
    narration: Do you need sunscreen on a cloudy day?
  - layout: bullets
    heading: What Dermatologists Say
    points:
    - Most UV passes through clouds
    - You feel cool and stay out
    - Check the UV index
    footage_query: overcast day park
    narration: Yes. Clouds block some light and heat, but much of the sun's UV radiation passes straight through
      them. Many people get their worst sunburns on cool, cloudy days, because they do not feel the sun and stay
      out longer. Check the UV index, and use broad spectrum sunscreen, SPF thirty or higher.
