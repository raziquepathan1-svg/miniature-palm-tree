      footage_query: "carbon monoxide alarm"
      narration: >-
        No color, no smell, no taste. Carbon monoxide can kill you in your sleep.
    - layout: "warning"
      heading: "Know the Signs"
      points: ["Headache and dizziness", "Several people sick at once", "Get out, call 911"]
      footage_query: "family sick couch"
      narration: >-
        Headache, dizziness, nausea and weakness, especially in several people at once and better when you leave home, can be
        carbon monoxide. Get everyone outside and call 911. Never run a generator indoors, and install CO alarms on every
        level of your home.
