plan:
  title: Flu, COVID or a Cold? How to Tell This Season
  description: 'Flu season started early this year, and flu, COVID and colds are all going around. Here is how to
    tell them apart, when to test, who should call a doctor early, the warning signs that need help right away,
    and why it is not too late for a flu shot.


    In this video:

    • Cold vs flu vs COVID

    • Testing and early treatment

    • Flu shot myths

    • Emergency warning signs


    #FluSeason #COVID #ColdAndFlu #HealthTips #HealthEducation'
