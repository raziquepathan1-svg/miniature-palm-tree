    - layout: "bullets"
      heading: "New Protection"
      points: ["Pregnancy vaccine at 32 to 36 weeks", "Or an antibody shot for baby", "One dose for adults 75+"]
      footage_query: "pregnant woman talking doctor"
      narration: >-
        Babies can be protected by a vaccine during pregnancy, or an antibody shot after birth. Adults seventy five and older,
        and those fifty to seventy four at higher risk, need just one RSV vaccine dose. Watch babies for fast breathing or
        ribs pulling in.
