queue_topic: "Headache red flags: when a headache is an emergency"
style: "Warning Signs"
sources:
  - "MedlinePlus, Headache: https://medlineplus.gov/headache.html"
  - "NIH NINDS, Headache: https://www.ninds.nih.gov/health-information/disorders/headache"
