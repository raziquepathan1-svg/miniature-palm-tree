      points: ["Celiac vs everyone else"]
      footage_query: "bread and wheat table"
      narration: >-
        Is gluten bad for everyone? Not really. But for people with celiac disease, it is a real problem.
    - layout: "warning"
      heading: "Test First"
      points: ["Do not stop gluten before testing", "Celiac: strict lifelong diet", "Gluten free is not healthier for all"]
      footage_query: "doctor drawing blood sample"
      narration: >-
        Celiac disease is an autoimmune disease that damages the small intestine when you eat gluten. If you suspect it, do
        not stop eating gluten until you are tested, because the tests only work if you are eating it. A gluten free diet is
        essential for celiac disease, but it is not healthier for everyone else.
    - layout: "outro"
      heading: "Full Video"
      points: ["On YouTube"]
      footage_query: "family at home together"
      narration: >-
        Learn more in our full video on the Health Support Studio channel.
story:
  open: >-
    Imagine Jon. He feels bloated after bread, so he stopped eating gluten last month on his own, and now he wants to be
    tested for celiac disease. By the end of this video, you will know what is wrong with that plan.
  twist: >-
    Remember Jon? Here is the twist. Celiac tests only work while you are eating gluten, so stopping first can hide the
    diagnosis, and a gluten free diet is not healthier for everyone.
  end: >-
    So what should Jon do? Talk to his doctor, ask for celiac testing before changing his diet, and if the test is positive,
    follow a strict gluten free diet with a dietitian.
  short_cliff: >-
    Jon stopped eating gluten last month and now wants to be tested for celiac disease. What is the problem?
  reel_answer: >-
    The answer: celiac tests only work while you are eating gluten. Do not stop gluten until you are tested.
