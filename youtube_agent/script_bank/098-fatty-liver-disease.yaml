story:
  open: >-
    Imagine Karim. A routine blood test showed high liver enzymes, but he feels fine, and he does not drink. By the end of
    this video, you will know what that could mean, and what Karim can do about it.
  twist: >-
    Remember Karim? Here is the twist. Fatty liver is often silent, most cases have nothing to do with drinking, and early
    damage can be reversed with weight loss, healthy eating, and movement.
  end: >-
    So what should Karim do? Talk to his doctor, lose a little weight slowly, eat more vegetables and fish, move most
    days, skip detox teas, and call his doctor for yellow skin or swelling.
  short_cliff: >-
    Karim feels fine and does not drink, but his liver tests are high. Could he still have a liver problem?
  reel_answer: >-
    The answer: yes. Fatty liver is often silent, and most cases are linked to weight, blood sugar, and cholesterol, not drinking. Early damage can often be reversed.
