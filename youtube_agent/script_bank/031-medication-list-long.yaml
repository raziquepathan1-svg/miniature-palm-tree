    - layout: "bullets"
      heading: "Keep a List"
      points: ["Every medicine and dose", "Supplements and allergies", "Wallet, phone and fridge"]
      footage_query: "person writing notebook"
      narration: >-
        So keep a list. Write every prescription with its dose and why you take it, plus over the counter medicines, vitamins,
        supplements and allergies. Keep a copy in your wallet, a photo on your phone, and one on the fridge. Update it after
        every change.
