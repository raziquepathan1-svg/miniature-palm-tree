queue_topic: "Blood clots (DVT and pulmonary embolism): warning signs and prevention"
style: "Warning Signs"
sources:
  - "CDC, Venous Thromboembolism (Blood Clots): https://www.cdc.gov/blood-clots/about/index.html"
  - "NIH NHLBI, Venous Thromboembolism: https://www.nhlbi.nih.gov/health/venous-thromboembolism"
