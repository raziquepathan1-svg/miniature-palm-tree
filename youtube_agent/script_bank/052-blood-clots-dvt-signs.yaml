        A swollen, sore calf after surgery or a long trip could be a blood clot.
    - layout: "warning"
      heading: "Know the Signs"
      points: ["Swelling, pain, warmth in one leg", "Sudden shortness of breath", "Chest pain: call 911"]
      footage_query: "man struggling breathe"
      narration: >-
        Swelling, pain, warmth or redness in one leg needs a same day check. If a clot travels to the lungs, it can cause
        sudden shortness of breath, chest pain or fainting. That is an emergency, so call 911. Hospital stays and surgery are
        the biggest risks.
