    - layout: "warning"
      heading: "Red Flags"
      points: ["Getting worse, not better", "Fever comes back", "Short of breath or confused"]
      footage_query: "woman coughing night"
      narration: >-
        Watch for a cough that gets worse instead of better, a fever that comes back, shortness of breath, or chest pain when
        breathing. In older adults, new confusion may be the only sign. The pneumococcal vaccine is now recommended for all
        adults fifty and older.
