    - A surprising clash
    footage_query: grapefruit breakfast table
    narration: Grapefruit juice with your morning pills could change how much medicine ends up in your blood.
  - layout: bullets
    heading: Why It Matters
    points:
    - Blocks a gut enzyme
    - Some statins and heart medicines
    - Spacing may not be enough
    footage_query: pill bottles kitchen
    narration: Grapefruit blocks an enzyme in your gut that breaks down some medicines, so more stays in your blood. This
      includes some statins, some blood pressure medicines and some heart rhythm medicines. The effect can last a day or more,
      so ask your pharmacist if your medicine is affected.
  - layout: outro
    heading: Full Video
    points:
    - On YouTube
    footage_query: pharmacy counter
    narration: Learn the other foods that clash with common medicines in our full video, on the Health Support Studio YouTube
      channel.
