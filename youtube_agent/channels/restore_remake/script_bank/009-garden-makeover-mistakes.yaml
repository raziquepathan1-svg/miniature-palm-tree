queue_topic: "Garden makeover mistakes beginners make"
style: "Mistakes to Avoid"
plan:
  topic: "Garden makeover mistakes beginners make"
  title: "6 Garden Makeover Mistakes That Waste Your Money"
  description: |-
    Planning a garden or yard makeover? Avoid these 6 beginner mistakes that waste money, kill plants and create more work, and learn what to do instead.

    In this video:
    • Ignoring sun and shade
    • Planting too close together
    • Skipping soil prep
    • Overwatering
    • Calling 811 before you dig

    #GardenMakeover #GardeningTips #BackyardIdeas #Landscaping #GardeningForBeginners
  tags: ["garden makeover", "gardening mistakes", "gardening for beginners", "landscaping mistakes", "backyard makeover", "garden ideas", "flower bed ideas", "how to plant a garden", "yard makeover", "budget landscaping", "garden tips"]
  thumbnail_text: "DON'T PLANT YET"
  thumbnail_highlight: "DON'T"
  thumbnail_photo_query: "garden planting flowers"
  playlist: "Garden & Backyard Makeovers"
  scenes:
    - layout: "title"
      heading: "6 Garden Makeover Mistakes"
      points: ["Save money, plants and time"]
      footage_query: "garden flower beds"
      narration: >-
        You spent a weekend and a few hundred dollars on plants, and by August half of them are dead. Sound familiar? Most
        garden makeovers fail because of a few beginner mistakes, not because you have a black thumb. Here are the six that
        waste the most money, and what to do instead.
    - layout: "bullets"
      heading: "Mistake 1: Ignoring Sun"
      points: ["Watch your yard for a full day", "Full sun: 6+ hours", "Read every plant tag"]
      footage_query: "sunlight garden plants"
      narration: >-
        Mistake one: ignoring sun and shade. Before you buy anything, watch your yard for a full day and note which spots get
        sun, and for how long. Full sun means six or more hours of direct sun. Then read every plant tag, and only buy plants
        that match the spot you have. A shade plant in full sun will scorch, no matter how much you water it.
    - layout: "bullets"
      heading: "Mistake 2: Skipping the Soil"
      points: ["Loosen soil 8-12 inches deep", "Mix in compost", "Bagged compost: about $5-$10"]
      footage_query: "garden soil compost hands"
      narration: >-
        Mistake two: skipping the soil. Plants are only as healthy as the ground they grow in. Loosen the soil about eight to
        twelve inches deep and mix in a few inches of compost before you plant. Bagged compost costs roughly five to ten
        dollars a bag, and it is the best money you will spend in the whole garden.
    - layout: "myth_fact"
      heading: "Mistake 3: Planting Too Close"
      points: ["More plants look fuller sooner", "Crowded plants fight and get sick"]
      footage_query: "planting flowers garden bed"
      narration: >-
        Mistake three: planting too close together. It feels like more plants will look fuller faster. In reality, crowded
        plants compete for water and light, and poor airflow invites disease. Follow the spacing on the tag, even if the bed
        looks a little empty at first. Fill gaps with mulch or cheap annual flowers for the first year.
    - layout: "bullets"
      heading: "Mistake 4: Overwatering"
      points: ["Water deeply, less often", "Check soil 2 inches down", "Early morning is best"]
      footage_query: "watering garden hose"
      narration: >-
        Mistake four: overwatering. More plants die from too much water than too little. Water deeply, then wait until the top
        inch or two of soil feels dry before you water again. Early morning is the best time, because less water evaporates and
        the leaves dry during the day. New plants need more frequent water for their first few weeks.
    - layout: "warning"
      heading: "Mistake 5: Not Calling 811"
      points: ["Free call before you dig", "Marks buried gas and power lines", "Required in many states"]
      footage_query: "digging garden shovel"
      narration: >-
        Mistake five is about safety. Before you dig for trees, shrubs, fence posts or a new bed, call eight one one, or
        request online. It is a free service in the United States that marks buried gas, power and water lines on your
        property. Hitting a line can be dangerous and very expensive, and in many states calling is required.
    - layout: "bullets"
      heading: "Mistake 6: All at Once"
      points: ["Start with one bed", "Plant in spring or fall", "Add a little each season"]
      footage_query: "gardener planting spring"
      narration: >-
        Mistake six: trying to do the entire yard in one weekend. You will run out of money, energy and time to water it all.
        Start with one bed near the front door or the patio, where you will see it every day. Spring and fall are usually the
        easiest times to plant, and you can add a little more every season.
    - layout: "outro"
      heading: "Right Plant, Right Place"
      points: ["Soil first, then plants", "Subscribe for more makeovers"]
      footage_query: "beautiful backyard garden"
      narration: >-
        So remember: right plant in the right place, soil first, give them room, water deeply, and call eight one one before
        you dig. If this saved you some money, give it a like and subscribe to Restore Remake Studio for a new makeover idea
        every day.
  short_title: "Why your new plants keep dying #Shorts"
  short_caption: >-
    New plants keep dying? It's probably not you. It's usually sun, soil or too much water. All 6 mistakes on our YouTube
    channel. #GardeningTips #GardenMakeover #GardeningForBeginners #BackyardIdeas #PlantCare
  short_scenes:
    - layout: "title"
      heading: "Plants Keep Dying?"
      points: ["It's probably not your fault"]
      footage_query: "garden flower beds"
      narration: >-
        If your new plants keep dying, it is probably not a black thumb. It is usually one of these three things.
    - layout: "bullets"
      heading: "Check These 3"
      points: ["Wrong sun for the plant", "No compost in the soil", "Too much water"]
      footage_query: "watering garden hose"
      narration: >-
        The plant is getting the wrong amount of sun for its tag. The soil was never loosened or fed with compost. Or it is
        getting watered too often. Water deeply, then let the top inch dry out.
    - layout: "outro"
      heading: "All 6 on YouTube"
      points: ["Restore Remake Studio"]
      footage_query: "beautiful backyard garden"
      narration: >-
        See all six garden makeover mistakes on the Restore Remake Studio YouTube channel.
