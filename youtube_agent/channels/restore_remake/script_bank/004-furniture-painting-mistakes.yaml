plan:
  topic: "Furniture painting mistakes to avoid"
  title: "7 Furniture Painting Mistakes That Ruin Your Flip"
  description: |-
    Painted a dresser and it peeled, chipped or looked streaky? These are the 7 most common furniture painting mistakes, and what to do instead, so your next flip looks professional.

    In this video:
    • Why skipping cleaning and scuffing makes paint peel
    • When you really need primer
    • Thin coats vs thick coats
    • Drying vs curing time
    • Lead paint on old furniture: test first

    #FurnitureFlip #PaintedFurniture #FurnitureMakeover #DIY #Upcycling
  tags: ["furniture painting mistakes", "how to paint furniture", "painting furniture tips", "furniture flip", "furniture makeover", "painted dresser", "chalk paint", "primer for furniture", "upcycling furniture", "diy furniture makeover", "thrift flip"]
  thumbnail_text: "STOP DOING THIS"
  thumbnail_highlight: "STOP"
  thumbnail_photo_query: "painting wooden dresser"
  playlist: "Furniture Flips & Upcycling"
  scenes:
    - layout: "title"
      heading: "7 Furniture Painting Mistakes"
      points: ["And what to do instead"]
      footage_query: "painting furniture brush"
      narration: >-
        You found a great old dresser, you painted it, and a week later the paint is peeling off in strips. It happens to
        almost everyone. Today we are going through the seven most common furniture painting mistakes, and exactly what to
        do instead, so your next flip looks professional.
    - layout: "myth_fact"
      heading: "Mistake 1: Skipping Cleaning"
      points: ["Paint sticks to anything", "Grease and polish make paint peel"]
      footage_query: "cleaning wooden furniture"
      narration: >-
        Mistake one: skipping the cleaning. Old furniture is covered in grease, furniture polish and grime, and paint will not
        stick to any of it. Scrub every surface with a degreaser, rinse with a damp cloth, and let it dry completely before
        you do anything else. Pull out the drawers and remove the hardware too, so you can clean and paint every edge.
    - layout: "bullets"
      heading: "Mistake 2: No Scuff Sanding"
      points: ["Glossy finishes need a scuff", "180-220 grit sandpaper", "Wipe off all the dust"]
      footage_query: "sanding wood furniture"
      narration: >-
        Mistake two: painting over a glossy finish without scuffing it. You do not need to sand down to bare wood. A light
        scuff with one hundred eighty to two hundred twenty grit sandpaper gives the paint something to grab. Then wipe away
        every bit of dust with a tack cloth. Dust trapped under paint feels gritty and looks cheap.
    - layout: "warning"
      heading: "Mistake 3: Ignoring Lead Paint"
      points: ["Common in pre-1978 paint", "Test with a lead test kit", "Never dry sand if positive"]
      footage_query: "old painted furniture vintage"
      narration: >-
        Mistake three, and this one matters for your health: ignoring lead. Paint made before 1978 in the United States may
        contain lead, and sanding it creates toxic dust. If a piece has old paint, test it with an inexpensive lead test kit
        first. If it is positive, do not sand or scrape it. Leave it as is, or get advice from a professional.
    - layout: "bullets"
      heading: "Mistake 4: Skipping Primer"
      points: ["Use primer on glossy or laminate", "Stain-blocking primer on oak", "Stops wood tannins bleeding through"]
      footage_query: "primer paint can brush"
      narration: >-
        Mistake four: skipping primer. On laminate, glossy finishes or very dark wood, a bonding primer is what keeps the
        paint on. On woods like oak and mahogany, a stain-blocking primer stops brownish tannins from bleeding through your
        nice white paint. Ask at the paint counter which primer matches your paint.
    - layout: "bullets"
      heading: "Mistakes 5 and 6: Thick Coats"
      points: ["Thin coats dry smoother", "Wait the full recoat time", "Paint with the wood grain"]
      footage_query: "painting furniture white brush"
      narration: >-
        Mistakes five and six: thick coats and rushing. Gloopy coats show brush marks, drip and stay soft. Two or three thin
        coats look far better. Wait the full recoat time on the can between coats, and brush in the direction of the wood
        grain for a smooth finish. A good quality brush or a small foam roller makes a huge difference.
    - layout: "big_number"
      heading: "Up to 30 days"
      points: ["for some paints to fully cure", "dry is not the same as cured"]
      footage_query: "painted dresser bedroom"
      narration: >-
        Mistake seven: using it too soon. Paint can be dry to the touch in an hour, but fully curing, meaning really hard,
        can take anywhere from a few days to around thirty days, depending on the paint. Check the can, and go easy on the
        piece until then. No heavy lamps or stacked books.
    - layout: "outro"
      heading: "Clean, Scuff, Prime, Thin Coats"
      points: ["Test old paint for lead", "Subscribe for more flips"]
      footage_query: "upcycled furniture painted"
      narration: >-
        So remember: clean, scuff, prime, thin coats, and patience. And test old paint for lead before you sand. If this
        saved your next flip, give it a like and subscribe to Restore Remake Studio for a new makeover idea every day.
  short_title: "Why your painted furniture peels #Shorts"
  short_caption: >-
    Painted a dresser and the paint is peeling? It's almost always one of these mistakes. Full list of 7 on our YouTube
    channel. #FurnitureFlip #PaintedFurniture #FurnitureMakeover #Upcycling #DIYTips
  short_scenes:
    - layout: "title"
      heading: "Why Your Paint Peels"
      points: ["It's usually step one"]
      footage_query: "painting furniture brush"
      narration: >-
        If the paint on your furniture flip is peeling off, you probably skipped the boring part.
    - layout: "bullets"
      heading: "Do This First"
      points: ["Degrease every surface", "Scuff with 220 grit", "Bonding primer on glossy finishes"]
      footage_query: "sanding wood furniture"
      narration: >-
        Scrub off the grease and polish, scuff the surface lightly with fine sandpaper, and use a bonding primer on anything
        glossy. Old paint from before 1978? Test it for lead before you sand. Then use thin coats, not thick ones.
    - layout: "outro"
      heading: "7 Mistakes on YouTube"
      points: ["Restore Remake Studio"]
      footage_query: "upcycled furniture painted"
