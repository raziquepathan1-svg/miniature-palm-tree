      points: ["Paint your front door"]
      footage_query: "front door house porch"
      narration: >-
        Want your house to look more expensive this weekend for about forty dollars? Paint your front door.
    - layout: "bullets"
      heading: "How to Do It"
      points: ["Clean and lightly sand", "Tape the hardware and glass", "Exterior paint, 2 thin coats"]
      footage_query: "painting door brush"
      narration: >-
        Clean the door, sand it lightly, and tape off the handle and glass. Then brush on two thin coats of exterior paint,
        and let each coat dry. One quart is usually enough. Prop the door open while it dries.
    - layout: "bullets"
      heading: "Colors That Pop"
      points: ["Black or navy: classic", "Red or teal: bold", "Pick a dry, mild day"]
      footage_query: "colorful front door house"
      narration: >-
        Black and navy look classic, while red and teal really pop. Pick a dry day that is not too hot or cold. Swap in a new house number too, and it looks like a brand new entry.
