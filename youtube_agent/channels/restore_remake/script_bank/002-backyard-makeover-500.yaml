queue_topic: "Backyard makeover on a 500 dollar budget"
style: "Budget Makeover"
plan:
  topic: "Backyard makeover on a 500 dollar budget"
  title: "Backyard Makeover for Under $500: Where Every Dollar Goes"
  description: |-
    Can you transform a boring backyard for under $500? Yes. Here's a realistic budget makeover, item by item, with typical US prices and a running total.

    In this video:
    • A weekend clean-up that costs almost nothing
    • Mulch and edging for instant curb appeal
    • Planters, string lights and a budget seating area
    • A simple gravel or paver patio corner

    #BackyardMakeover #BudgetBackyard #GardenIdeas #OutdoorLiving #DIYGarden
  tags: ["backyard makeover", "backyard on a budget", "cheap backyard ideas", "small backyard ideas", "garden makeover", "outdoor living ideas", "string lights backyard", "diy patio", "budget landscaping", "backyard ideas", "yard makeover"]
  thumbnail_text: "ONLY $500 BACKYARD"
  thumbnail_highlight: "$500"
  thumbnail_photo_query: "backyard patio string lights"
  playlist: "Garden & Backyard Makeovers"
  scenes:
    - layout: "title"
      heading: "Backyard Makeover Under $500"
      points: ["Item by item, with real prices"]
      footage_query: "backyard garden summer"
      narration: >-
        A backyard you actually want to spend time in does not have to cost thousands. Today we are planning a full backyard
        makeover for under five hundred dollars, item by item, with typical prices from American home improvement stores,
        and a running total so you can see where every dollar goes.
    - layout: "bullets"
      heading: "Step 1: Clean Up First"
      points: ["Mow, weed and trim", "Pressure wash or scrub", "Borrow or rent tools", "Cost: about $0-$60"]
      footage_query: "mowing lawn backyard"
      narration: >-
        Step one costs almost nothing: a serious clean-up. Mow, pull weeds, trim overgrown bushes and haul away junk. Scrub
        your patio or deck, or rent a pressure washer for about fifty to sixty dollars a day. A clean yard already looks like
        half a makeover. Take a before photo now, because you will want to compare later.
    - layout: "bullets"
      heading: "Step 2: Mulch and Edging"
      points: ["10-15 bags of mulch", "Crisp bed edges with a spade", "Cost: about $60-$90"]
      footage_query: "garden mulch flower bed"
      narration: >-
        Step two: mulch and edging. Cut a crisp edge around your flower beds with a flat spade, then spread fresh mulch about
        two to three inches deep. Ten to fifteen bags usually cost sixty to ninety dollars. It hides weeds, holds moisture,
        and makes everything look finished. Dark brown or black mulch makes green plants and flowers really stand out.
    - layout: "bullets"
      heading: "Step 3: Plants in Pots"
      points: ["3 big planters by the seating", "Easy flowers and herbs", "Cost: about $100"]
      footage_query: "planting flowers pots garden"
      narration: >-
        Step three: plants in big pots. Group three large planters near where you will sit. Fill them with easy, long-blooming
        flowers like petunias or geraniums, or herbs you can cook with. Planters, soil and plants run about one hundred
        dollars. Running total so far: around two hundred fifty dollars. Big pots look more intentional than lots of small ones, and they dry out more slowly in summer heat.
    - layout: "bullets"
      heading: "Step 4: A Gravel Seating Corner"
      points: ["Landscape fabric underneath", "Pea gravel, 2-3 inches deep", "Cost: about $80-$120"]
      footage_query: "gravel patio garden chairs"
      narration: >-
        Step four: create a seating corner. Lay landscape fabric on a flat, level patch of yard, then spread pea gravel two
        to three inches deep. For a small ten by ten foot area, expect about eighty to one hundred twenty dollars. It is one
        of the cheapest patios you can build. Add a simple border of bricks or pavers so the gravel stays in place and the corner looks finished.
    - layout: "bullets"
      heading: "Step 5: Lights and Seating"
      points: ["Outdoor string lights", "Two chairs from Marketplace", "Cost: about $90-$130"]
      footage_query: "string lights backyard evening"
      narration: >-
        Step five is where the magic happens: string lights and seating. Outdoor-rated string lights cost about thirty to
        fifty dollars. Find two chairs and a small table secondhand on Facebook Marketplace for around sixty to eighty more.
        Plug lights only into an outdoor, covered outlet. Zigzag the lights between your house and a fence post or a sturdy pole to create a cozy ceiling over the seating.
    - layout: "big_number"
      heading: "≈ $480"
      points: ["total for the whole makeover", "prices vary by area"]
      footage_query: "backyard patio furniture evening"
      narration: >-
        Add it all up, and you land at roughly four hundred eighty dollars. Prices vary by area and season, and shopping end of
        season sales or secondhand can cut that a lot. You can also spread it out over a few weekends. Most of the projects are beginner friendly, and you do not need special tools beyond a spade, a rake and a wheelbarrow.
    - layout: "outro"
      heading: "Start This Weekend"
      points: ["Clean up first, it's free", "Subscribe for more makeovers"]
      footage_query: "family relaxing backyard"
      narration: >-
        Start with the free step this weekend, and add one piece at a time. If you want more budget makeovers like this, give
        the video a like and subscribe to Restore Remake Studio. A new makeover idea goes up every day.
  short_title: "The $50 trick that transforms a backyard #Shorts"
  short_caption: >-
    Want your backyard to feel like a getaway on a budget? String lights plus a simple gravel corner do most of the work.
    Full under 500 dollar makeover on our YouTube channel. #BackyardMakeover #BudgetBackyard #OutdoorLiving #GardenIdeas #DIYGarden
