      points: ["Two cheap fixes"]
      footage_query: "backyard garden summer"
      narration: >-
        Your backyard is boring, and you do not have thousands to spend. Here are two fixes that do most of the work.
    - layout: "bullets"
      heading: "Lights and a Gravel Corner"
      points: ["String lights: $30-$50", "Pea gravel seating spot", "Two secondhand chairs"]
      footage_query: "string lights backyard evening"
      narration: >-
        First, outdoor string lights for about thirty to fifty dollars. Second, a small pea gravel corner with two secondhand
        chairs. Suddenly you have a spot you actually want to sit in at night.
    - layout: "outro"
