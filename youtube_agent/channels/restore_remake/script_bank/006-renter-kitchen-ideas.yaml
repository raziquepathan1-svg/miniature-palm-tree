queue_topic: "Renter-friendly kitchen makeover ideas"
style: "Makeover Ideas"
plan:
  topic: "Renter-friendly kitchen makeover ideas"
  title: "7 Renter-Friendly Kitchen Upgrades (No Landlord Drama)"
  description: |-
    Stuck with a dated rental kitchen? These 7 renter-friendly makeover ideas are cheap, removable and make a big difference. Keep the original parts and you can put everything back when you move out.

    In this video:
    • Peel-and-stick backsplash
    • Swapping cabinet hardware
    • Under-cabinet lighting with no wiring
    • Open shelving, plants and a rug
    • Clearing the counters

    #RentalMakeover #KitchenMakeover #RenterFriendly #ApartmentDecor #BudgetDecor
  tags: ["renter friendly kitchen", "rental kitchen makeover", "apartment kitchen ideas", "kitchen makeover on a budget", "peel and stick backsplash", "rental hacks", "small kitchen ideas", "renter friendly decor", "kitchen upgrades", "budget kitchen", "apartment makeover"]
  thumbnail_text: "RENTAL KITCHEN GLOW-UP"
  thumbnail_highlight: "RENTAL"
  thumbnail_photo_query: "small apartment kitchen"
  playlist: "Small Spaces & Rentals"
  scenes:
    - layout: "title"
      heading: "Rental Kitchen Makeover"
      points: ["7 cheap, removable upgrades"]
      footage_query: "small apartment kitchen"
      narration: >-
        Renting does not mean you are stuck with a sad, dated kitchen. Today you will get seven renter-friendly upgrades that
        are cheap, removable and make a big difference. One rule before we start: read your lease, ask your landlord about
        anything you are unsure of, and keep every original part in a labeled bag so you can put it back when you move out.
    - layout: "bullets"
      heading: "1. Peel-and-Stick Backsplash"
      points: ["Covers dated tile or bare walls", "About $5-$15 per square foot", "Test a small spot first"]
      footage_query: "kitchen backsplash tiles"
      narration: >-
        Idea one: a peel-and-stick backsplash. It covers dated tile or plain walls in an afternoon. Expect roughly five to
        fifteen dollars per square foot. Clean the wall well so it sticks, and test a small hidden spot first, because some
        adhesives can pull off paint when you remove them. Subway tile and simple patterns look the most realistic.
    - layout: "bullets"
      heading: "2. Swap the Hardware"
      points: ["New knobs and pulls", "Keep the originals", "Match the hole spacing"]
      footage_query: "kitchen cabinet handles"
      narration: >-
        Idea two: swap the cabinet hardware. New knobs and pulls in matte black, brass or brushed nickel make old cabinets
        look updated instantly. Measure the distance between screw holes so the new pulls fit the existing holes, and keep the
        old ones in a bag for move-out day. A screwdriver is the only tool you need.
    - layout: "bullets"
      heading: "3. Under-Cabinet Lights"
      points: ["Battery or plug-in LED strips", "No wiring needed", "About $20-$40"]
      footage_query: "kitchen under cabinet lighting"
      narration: >-
        Idea three: under-cabinet lighting. Battery powered or plug-in LED light bars stick on with adhesive or magnets, so
        there is no wiring to change. For about twenty to forty dollars, your counters are brighter for cooking and the whole
        kitchen looks more expensive at night. Look for warm white light so it matches the rest of the room.
    - layout: "bullets"
      heading: "4 and 5. Shelf and Rug"
      points: ["Tension rod or over-door storage", "Washable runner rug", "Adds color and comfort"]
      footage_query: "kitchen rug runner"
      narration: >-
        Ideas four and five: smart storage and a rug. Use tension rods, over-the-door organizers and freestanding shelves
        instead of drilling. Then add a washable runner rug. It brings in color and pattern, hides a tired floor, and makes
        standing at the counter more comfortable. Pick a darker pattern that hides spills.
    - layout: "bullets"
      heading: "6. Clear the Counters"
      points: ["Keep out only daily items", "Use a tray to group things", "Instantly looks bigger"]
      footage_query: "clean kitchen countertop"
      narration: >-
        Idea six costs nothing: clear the counters. Keep out only what you use every day, like the coffee maker, and group
        small items like oil and salt on a tray. Empty counters make a small kitchen look bigger, cleaner and more expensive
        than any product can.
    - layout: "bullets"
      heading: "7. Plants and Art"
      points: ["Herbs on the windowsill", "Small framed print", "Command strips, no nails"]
      footage_query: "herbs windowsill kitchen"
      narration: >-
        Idea seven: bring it to life. Put a few herbs on the windowsill, add a small framed print, and hang it with removable
        adhesive strips instead of nails. These personal touches are what make a rental kitchen finally feel like your
        kitchen. Most of these ideas together cost less than one month of a streaming bundle and a takeout dinner.
    - layout: "outro"
      heading: "Keep the Originals"
      points: ["Everything goes back at move-out", "Subscribe for more makeovers"]
      footage_query: "modern kitchen interior bright"
      narration: >-
        Start with the free one, clearing the counters, then add hardware and lighting. Keep every original part, and you can
        restore the kitchen when you leave. If this helped, give it a like and subscribe to Restore Remake Studio for a new
        makeover idea every day.
  short_title: "Renter? Do this to your kitchen #Shorts"
  short_caption: >-
    Renting with a dated kitchen? Swap the hardware and add stick-on lights, then put the originals back when you move.
    More renter friendly ideas on our YouTube channel. #RentalMakeover #KitchenMakeover #RenterFriendly #ApartmentDecor #BudgetDecor
  short_scenes:
    - layout: "title"
      heading: "Renter Kitchen Hack"
      points: ["No drilling, no drama"]
      footage_query: "small apartment kitchen"
      narration: >-
        Renting with an ugly kitchen? Here are two upgrades you can undo on move-out day.
    - layout: "bullets"
      heading: "Two Upgrades"
      points: ["New knobs and pulls", "Stick-on LED lights", "Keep the originals"]
      footage_query: "kitchen under cabinet lighting"
      narration: >-
        Swap the cabinet knobs and pulls, and add stick-on LED lights under the cabinets. Keep the original hardware in a bag,
        and put it back when you move out. It takes about twenty minutes and makes the whole kitchen look newer.
    - layout: "outro"
      heading: "5 More on YouTube"
      points: ["Restore Remake Studio"]
      footage_query: "modern kitchen interior bright"
      narration: >-
        See all seven renter friendly ideas on the Restore Remake Studio YouTube channel.
