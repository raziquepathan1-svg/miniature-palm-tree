plan:
  topic: "How to paint a room like a pro"
  title: "How to Paint a Room Like a Pro (Beginner Step by Step)"
  description: |-
    Painting is the cheapest way to transform a room, if you do it right. Here's a beginner-friendly, step-by-step guide to painting a room with clean lines and no streaks.

    In this video:
    • How much paint to buy
    • Prep that makes the difference
    • Cutting in and rolling the right way
    • Clean tape lines

    #PaintingTips #RoomMakeover #DIYHome #HomeMakeover #InteriorPainting
  tags: ["how to paint a room", "painting tips", "interior painting", "room makeover", "diy painting", "painting for beginners", "how to cut in paint", "paint roller tips", "wall painting", "home makeover", "paint like a pro"]
  thumbnail_text: "NO MORE STREAKS"
  thumbnail_highlight: "STREAKS"
  thumbnail_photo_query: "painting wall roller"
  playlist: "Room Makeovers"
  scenes:
    - layout: "title"
      heading: "Paint a Room Like a Pro"
      points: ["Clean lines, no streaks"]
      footage_query: "painting wall roller"
      narration: >-
        Paint is the cheapest way to completely transform a room. But streaky walls and wobbly lines can make it look like a
        rushed weekend job. Today we will paint a room step by step the way the pros do it, from how much paint to buy to
        peeling off the tape.
    - layout: "big_number"
      heading: "350-400 sq ft"
      points: ["covered by one gallon, per coat", "Plan on two coats"]
      footage_query: "paint cans colors"
      narration: >-
        Step one: buy the right amount. One gallon usually covers about three hundred fifty to four hundred square feet per
        coat. Multiply the length of each wall by its height, add them up, and plan on two coats. A typical twelve by twelve
        foot bedroom needs about two gallons. Good interior paint runs about thirty to sixty dollars a gallon.
    - layout: "bullets"
      heading: "Step 2: Prep the Room"
      points: ["Move furniture to the center", "Remove outlet covers", "Fill holes, sand smooth", "Wipe walls clean"]
      footage_query: "room preparation painting"
      narration: >-
        Step two: prep, which is where pros win. Move furniture to the middle of the room and cover it and the floor with drop
        cloths. Remove outlet and switch covers. Fill nail holes with spackle, let it dry and sand it smooth. Then wipe the
        walls with a damp cloth so the paint sticks to clean surfaces.
    - layout: "bullets"
      heading: "Step 3: Tape and Prime"
      points: ["Painter's tape on trim", "Press the edge down firmly", "Prime patches and dark colors"]
      footage_query: "painters tape wall"
      narration: >-
        Step three: tape and prime. Run painter's tape along the trim and ceiling, and press the edge down firmly with a putty
        knife so paint cannot bleed under it. Spot prime any patched areas. If you are going from a dark color to a light one,
        prime the whole wall first, or use a paint with built in primer.
    - layout: "bullets"
      heading: "Step 4: Cut In First"
      points: ["2 to 3 inch angled brush", "Paint a band along edges", "Work one wall at a time"]
      footage_query: "paint brush wall edge"
      narration: >-
        Step four: cut in. With a two to three inch angled brush, paint a band a few inches wide along the ceiling, corners,
        trim and outlets. Work one wall at a time, so the cut in paint is still wet when you roll next to it. That way the
        brushed and rolled areas blend with no visible lines.
    - layout: "bullets"
      heading: "Step 5: Roll in a W"
      points: ["Load the roller evenly", "Roll a big W, then fill in", "Keep a wet edge", "Don't press too hard"]
      footage_query: "paint roller wall"
      narration: >-
        Step five: roll. Load the roller evenly in the tray, then roll a large W shape on the wall, and fill it in without
        lifting the roller. Keep a wet edge by always rolling back into paint that is still wet. Do not press hard, because
        that leaves streaks. Let the first coat dry fully, then roll the second coat the same way.
    - layout: "bullets"
      heading: "Step 6: Pull the Tape"
      points: ["Pull while paint is slightly wet", "Pull at a 45-degree angle", "Ventilate the room"]
      footage_query: "removing painters tape"
      narration: >-
        Step six: pull the tape. Peel it off slowly at an angle, while the last coat is still slightly wet, so the paint does
        not tear with it. Keep windows open and a fan running for ventilation while you paint and while it dries. If your home
        was built before 1978, do not sand old paint without testing it for lead.
    - layout: "outro"
      heading: "Prep Is Everything"
      points: ["Cut in, roll, two coats", "Subscribe for more makeovers"]
      footage_query: "freshly painted room interior"
      narration: >-
        Prep well, cut in one wall at a time, roll in a W, and do two coats. That is how a weekend paint job looks
        professional. If this helped, give it a like and subscribe to Restore Remake Studio for a new makeover idea every day.
  short_title: "The roller trick for streak-free walls #Shorts"
  short_caption: >-
    Streaky walls? Roll a big W, fill it in, and always roll back into wet paint. Full how to paint a room guide on our
    YouTube channel. #PaintingTips #RoomMakeover #DIYHome #InteriorPainting #HomeMakeover
  short_scenes:
    - layout: "title"
      heading: "No More Streaky Walls"
      points: ["The roller trick pros use"]
      footage_query: "paint roller wall"
      narration: >-
        If your painted walls always look streaky, you are probably rolling them wrong. Here is the fix.
    - layout: "bullets"
      heading: "Roll a W"
      points: ["Load the roller evenly", "Roll a big W, then fill in", "Keep a wet edge"]
      footage_query: "painting wall roller"
      narration: >-
        Load the roller evenly, roll a big W shape, then fill it in without lifting the roller. Always roll back into wet paint,
        and do not press hard. Then let it dry and roll a second coat the same way.
    - layout: "outro"
      heading: "Full Guide on YouTube"
      points: ["Restore Remake Studio"]
      footage_query: "freshly painted room interior"
      narration: >-
        Watch the full guide on the Restore Remake Studio YouTube channel.
