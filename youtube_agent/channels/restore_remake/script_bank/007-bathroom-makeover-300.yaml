plan:
  topic: "Bathroom makeover for under 300 dollars"
  title: "Bathroom Makeover Under $300: The Full Budget Breakdown"
  description: |-
    You don't need a remodel to fall in love with your bathroom again. Here's a realistic bathroom makeover for under $300, item by item, with a running total.

    In this video:
    • Fresh caulk and a deep clean
    • Paint made for bathrooms
    • Mirror, light and faucet-free upgrades
    • Towels, shower curtain and storage

    #BathroomMakeover #BudgetBathroom #HomeMakeover #DIYHome #BathroomIdeas
  tags: ["bathroom makeover", "bathroom makeover on a budget", "cheap bathroom ideas", "small bathroom ideas", "bathroom refresh", "diy bathroom", "budget home makeover", "recaulk bathtub", "bathroom decor", "home makeover", "bathroom upgrade"]
  thumbnail_text: "$300 BATHROOM"
  thumbnail_highlight: "$300"
  thumbnail_photo_query: "modern bathroom white"
  playlist: "Kitchen & Bath Makeovers"
  scenes:
    - layout: "title"
      heading: "Bathroom Makeover Under $300"
      points: ["No remodel needed"]
      footage_query: "modern bathroom interior"
      narration: >-
        A full bathroom remodel can cost thousands of dollars. But a bathroom that looks fresh and feels like a little spa?
        That can cost under three hundred. Today we are planning a bathroom makeover item by item, with typical American
        prices and a running total, and none of it needs a plumber.
    - layout: "bullets"
      heading: "Step 1: Deep Clean and Caulk"
      points: ["Scrub grout with a stiff brush", "Remove old moldy caulk", "New silicone caulk: about $10"]
      footage_query: "cleaning bathroom tiles"
      narration: >-
        Step one: deep clean and recaulk. Scrub the grout with a stiff brush and a bathroom cleaner. Then cut out the old,
        yellowed or moldy caulk around the tub and sink, clean the gap, let it dry, and run a fresh bead of kitchen and bath
        silicone. A tube costs about ten dollars, and the tub instantly looks newer. Let it cure for a full day before you shower.
    - layout: "bullets"
      heading: "Step 2: Paint for Bathrooms"
      points: ["Use moisture-resistant paint", "Satin or semi-gloss finish", "About $40-$60 for a gallon"]
      footage_query: "painting bathroom wall"
      narration: >-
        Step two: paint. Choose a paint labeled for kitchens and bathrooms, in a satin or semi-gloss finish, because it handles
        moisture and wipes clean. One gallon usually covers a whole bathroom and costs around forty to sixty dollars with
        supplies. Soft white, pale blue or sage green all feel fresh and clean. Run the fan or open a window while you paint and while it dries.
    - layout: "bullets"
      heading: "Step 3: A Better Mirror"
      points: ["Swap a plain builder mirror", "Round or framed styles", "About $50-$80"]
      footage_query: "bathroom mirror sink"
      narration: >-
        Step three: the mirror. A plain builder grade mirror makes a bathroom look generic. Swapping it for a framed or round
        mirror is one of the biggest visual upgrades in the room, and good ones cost about fifty to eighty dollars. Running
        total so far: around one hundred fifty dollars.
    - layout: "warning"
      heading: "Lights and Fixtures"
      points: ["Hard-wired lights: turn off breaker", "Not sure? Hire an electrician", "Easy swap: brighter LED bulbs"]
      footage_query: "bathroom vanity lighting"
      narration: >-
        Step four is lighting, with a safety note. Replacing a hard-wired light fixture means working with electricity, so if
        you have never done it, hire a licensed electrician. The easy option is free of risk: put in brighter, daylight LED
        bulbs, around five thousand Kelvin. Bathrooms look cleaner in bright, white light. If your fixture looks dated, a new glass shade can also help.
    - layout: "bullets"
      heading: "Step 5: Textiles and Storage"
      points: ["Matching towel set", "New shower curtain and liner", "Over-toilet shelf or baskets", "About $100"]
      footage_query: "white towels bathroom"
      narration: >-
        Step five: textiles and storage. A set of matching towels, a new shower curtain with a fresh liner, and a bath mat make
        the room feel coordinated. Add an over-the-toilet shelf or a few baskets so the counter stays clear. Budget around one
        hundred dollars for all of it.
    - layout: "big_number"
      heading: "≈ $280"
      points: ["total for the whole makeover", "prices vary by store and area"]
      footage_query: "bathroom plants decor"
      narration: >-
        Add a small plant that likes humidity, like a pothos, and your total lands at about two hundred eighty dollars. Prices
        vary by store and area, and discount stores and secondhand mirrors can bring it down even more.
    - layout: "outro"
      heading: "Start with Caulk and Paint"
      points: ["Biggest change, least money", "Subscribe for more makeovers"]
      footage_query: "modern bathroom white"
      narration: >-
        If you only do two things, do the caulk and the paint. They give the biggest change for the least money. If you liked
        this budget breakdown, give it a like and subscribe to Restore Remake Studio for a new makeover idea every day.
  short_title: "The $10 fix for an old bathtub #Shorts"
  short_caption: >-
    Yellow, moldy caulk makes any tub look old. A ten dollar tube of silicone makes it look new. Full under 300 dollar bathroom
