      points: ["It's not the tub, it's the caulk"]
      footage_query: "bathtub bathroom white"
      narration: >-
        If your bathtub looks old and dirty no matter how much you scrub, the problem might not be the tub.
    - layout: "bullets"
      heading: "Recaulk It"
      points: ["Cut out old caulk", "Clean and dry the gap", "Fresh silicone bead"]
      footage_query: "cleaning bathroom tiles"
      narration: >-
        It is the caulk. Cut out the old, yellow caulk, clean and dry the gap, and run a fresh bead of kitchen and bath
        silicone. It costs about ten dollars.
