# Textbook labels for our anatomy clips (youtube_agent/anatomy_labels.py). Positions are fractions of the
# frame (x, y); "words" bring the clip onto a matching page of a video; "at" is where the text sits, "to" is the part the line points at; times in seconds.
16x9_lungs_breathing.mp4:
  words: [lungs, lung, breathing, breathe, breath, asthma, copd, pneumonia, oxygen, inhaler, smoking, shortness of breath]
  title: "The Lungs"
  labels:
    - {text: "Windpipe (trachea)", at: [0.30, 0.22], to: [0.497, 0.245], start: 0.6}
    - {text: "Bronchi (air tubes)", at: [0.70, 0.34], to: [0.565, 0.40], start: 1.2}
    - {text: "Right lung", at: [0.25, 0.62], to: [0.37, 0.57], start: 1.8}
    - {text: "Left lung", at: [0.75, 0.66], to: [0.63, 0.61], start: 2.4}
  until: 3.6
  note: {text: "Air in: oxygen into the blood. Carbon dioxide out.", start: 3.8}
16x9_heart_beating.mp4:
  words: [heart, heart attack, cardiac, chest pain, blood pressure, hypertension, cholesterol, heartbeat, heart failure, afib, arteries]
  title: "The Heart"
  labels:
    - {text: "Aorta (main artery)", at: [0.68, 0.14], to: [0.53, 0.15], start: 0.6}
    - {text: "Right atrium", at: [0.24, 0.40], to: [0.385, 0.41], start: 1.2}
    - {text: "Coronary arteries", at: [0.72, 0.46], to: [0.53, 0.58], start: 1.8}
    - {text: "Right ventricle", at: [0.27, 0.72], to: [0.44, 0.68], start: 2.4}
    - {text: "Left ventricle", at: [0.73, 0.72], to: [0.60, 0.66], start: 3.0}
  until: 4.6
  note: {text: "It beats about 100,000 times a day", start: 4.9}
16x9_brain_neurons.mp4:
  words: [brain, stroke, memory, dementia, alzheimer, nerve, nerves, migraine, concussion, seizure, neurons]
  title: "The Brain"
  note: {text: "Billions of nerve cells send signals", start: 1.2}
  labels:
    - {text: "Nerve cell (neuron)", at: [0.30, 0.78], to: [0.48, 0.52], start: 6.4}
